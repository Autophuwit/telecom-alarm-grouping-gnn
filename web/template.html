<meta charset="utf-8">
<title>Alarm Incidents</title>

<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#21262d; --ink:#c9d1d9;
    --dim:#7d8590; --accent:#58a6ff;
    --ok:#3fb950; --bad:#f85149; --unk:#6e7681; --topo:#d29922;
    --find:#bc8cff;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--ink);
    font:13px/1.55 ui-monospace,SFMono-Regular,"Cascadia Mono",Menlo,Consolas,monospace;
    display:flex;flex-direction:column;overflow:hidden;
  }
  header{
    padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;gap:16px;flex-wrap:nowrap;flex:0 0 auto;
  }
  header h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.02em;
            white-space:nowrap}
  #ccount{white-space:nowrap}
  .cnt{color:var(--dim);font-size:12px}
  .meta{color:var(--dim);font-size:10.5px}
  header label{display:flex;align-items:center;gap:6px;font-size:12px;
               cursor:pointer;user-select:none}
  input[type=checkbox]{accent-color:var(--accent)}
  input[type=range]{accent-color:var(--accent);width:170px}
  select,input[type=text]{
    background:var(--bg);border:1px solid var(--line);color:var(--ink);
    padding:5px 8px;border-radius:5px;font:inherit;font-size:12px;
  }
  select:focus,input:focus{outline:none;border-color:var(--accent)}
  button{
    background:var(--bg);border:1px solid var(--line);color:var(--ink);
    padding:5px 10px;border-radius:5px;font:inherit;font-size:12px;cursor:pointer;
  }
  button:hover{border-color:var(--accent);color:var(--accent)}
  main{flex:1;display:flex;min-height:0}

  :root{--list-w:390px; --detail-w:352px}
  #list{width:var(--list-w);flex:0 0 var(--list-w);background:var(--panel);
        border-right:1px solid var(--line);overflow-y:auto}
  body.lshut #list, body.dshut #detail{display:none}
  .grip{position:relative;z-index:6;cursor:col-resize;user-select:none}

  .grip::after{position:absolute;top:50%;left:50%;width:14px;height:46px;
               margin:-23px 0 0 -7px;border-radius:7px;background:var(--panel);
               border:1px solid var(--line);color:var(--dim);font-size:14px;
               line-height:44px;text-align:center;cursor:pointer}
  #listGrip::after{content:'\2039'}
  body.lshut #listGrip::after{content:'\203A'}
  #detailGrip::after{content:'\203A'}
  body.dshut #detailGrip::after{content:'\2039'}
  .grip:hover::after,.grip.on::after{color:var(--accent);
                                     border-color:var(--accent)}
  #listGrip{flex:0 0 7px;background:var(--panel);border-right:1px solid var(--line)}
  #listGrip:hover,#listGrip.on{background:#1c2129}
  #detailGrip{position:absolute;top:12px;bottom:12px;width:9px;
              right:calc(12px + var(--detail-w))}
  body.dshut #detailGrip{right:3px}
  body.resizing, body.resizing *{cursor:col-resize !important}
  #search{padding:9px;border-bottom:1px solid var(--line);position:sticky;
          top:0;background:var(--panel);z-index:2}
  #search input{width:100%}
  .card{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .card:hover{background:#1c2129}
  .card.sel{background:#132339;border-left:3px solid var(--accent);padding-left:11px}
  .card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .card .top b{font-size:13px;color:#fff;font-weight:600}
  .sub{margin-top:4px;color:var(--dim);font-size:11px;display:flex;
       flex-wrap:wrap;gap:4px 8px;align-items:center}
  .chip{font-size:10px;padding:1px 6px;border-radius:8px;color:#0d1117;font-weight:600}
  #stage{flex:1;position:relative;min-width:0}
  canvas{display:block;width:100%;height:100%;cursor:grab;position:relative;z-index:1}

  #leafClip{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
  #leaf{position:absolute;left:0;top:0;z-index:0;transform-origin:0 0;
        pointer-events:none;background:transparent}
  #leaf[hidden]{display:none}
  #leaf .leaflet-container{background:transparent}
  #leaf.inv .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg)}
  canvas.drag{cursor:grabbing}
  #legend{position:absolute;left:12px;bottom:12px;z-index:3;background:#0d1117d9;
          border:1px solid var(--line);border-radius:7px;padding:10px 13px;
          font-size:11px;color:var(--dim);max-width:274px;line-height:1.65}
  .lg{display:flex;align-items:center;gap:7px;margin:1px 0}
  .lgd{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .lgs{width:9px;height:9px;flex:0 0 auto;transform:rotate(45deg);border:1.5px solid}
  .lgl{width:16px;height:0;border-top-width:2px;border-top-style:solid;flex:0 0 auto}

  .lg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;
        cursor:pointer;user-select:none;color:var(--ink);font-size:10px;
        text-transform:uppercase;letter-spacing:.08em;margin:-2px 0 4px}
  .lg-h:hover{color:var(--accent)}
  #legend.min .lg-h{margin:-2px 0}
  #legend.min .lg-b{display:none}
  #detail{position:absolute;right:12px;top:12px;z-index:3;width:var(--detail-w);
          max-height:calc(100% - 24px);overflow-y:auto;background:#0d1117f2;
          border:1px solid var(--line);border-radius:7px;padding:12px 14px;font-size:12px}
  #detail h2{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;
             color:var(--dim);margin:12px 0 5px;font-weight:600}
  #detail h2:first-child{margin-top:0}
  .row{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
  .row span:last-child{color:#fff;text-align:right;font-variant-numeric:tabular-nums}
  .hint{color:var(--dim);font-size:11px;line-height:1.5}
  .note{border-left:2px solid var(--find);padding:4px 0 4px 8px;margin:6px 0;
        font-size:11px;line-height:1.5;color:var(--ink)}
  .note.plain{border-left-color:var(--dim);color:var(--dim)}
  #tip{position:absolute;pointer-events:none;background:#000e;color:#fff;
       border:1px solid var(--line);border-radius:5px;padding:4px 8px;
       font-size:11px;display:none;white-space:nowrap;z-index:5}
  #empty{position:absolute;inset:0;z-index:2;pointer-events:none;display:flex;align-items:center;
         justify-content:center;color:var(--dim);font-size:13px}
  hr{border:0;border-top:1px solid var(--line);margin:10px 0}

  .br{display:flex;align-items:baseline;gap:7px;margin:2px 0 1px}
  .br-big{font-size:27px;line-height:1;color:#fff;font-weight:600;
          font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .br-u{font-size:11.5px;color:var(--dim)}
  .viz{display:block;width:100%;height:auto;margin:7px 0 2px}
  .cap{color:var(--dim);font-size:10px;margin:0 0 4px}

  .tl{margin:2px 0 0 4px;border-left:1px solid var(--line);padding-left:0}
  .tl-b{position:relative;padding:4px 0 5px 13px}
  .tl-b::before{content:'';position:absolute;left:-4.5px;top:9px;width:8px;
                height:8px;border-radius:50%;background:var(--unk);
                border:1px solid var(--bg)}
  .tl-b.first::before{background:var(--accent);box-shadow:0 0 0 3px #58a6ff2e}
  .tl-t{display:flex;flex-wrap:wrap;gap:2px 7px;align-items:baseline;
        color:var(--dim);font-size:10px}
  .tl-t b{color:var(--ink);font-size:11px;font-weight:600;
          font-variant-numeric:tabular-nums}
  .tl-tag{color:var(--accent);font-size:9.5px;text-transform:uppercase;
          letter-spacing:.05em}
  .tl-e{display:flex;gap:6px;align-items:baseline;padding:2px 5px 2px 3px;
        margin:1px 0 0 -3px;border-radius:4px;cursor:pointer}
  .tl-e:hover{background:#1c2129}
  .tl-e.on{background:#132339;box-shadow:inset 2px 0 0 var(--accent)}
  .tl-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;
          transform:translateY(-1px)}
  .tl-s{color:#fff;font-weight:600;flex:0 0 auto}
  .tl-n{color:var(--dim);font-size:11px;flex:1 1 auto;min-width:0;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tl-tk{color:var(--find);font-size:10px;flex:0 0 auto;opacity:.85}
  .tl-gap{color:var(--dim);font-size:9.5px;padding:1px 0 1px 13px;opacity:.65;
          font-style:italic}
  .tl-more{margin-top:6px;padding:5px 0;text-align:center;cursor:pointer;
           border:1px dashed var(--line);border-radius:5px;color:var(--dim);
           font-size:11px}
  .tl-more:hover{border-color:var(--accent);color:var(--accent)}
  .tl-e.future{opacity:.28}
  .tl-b.now::before{background:#fff;box-shadow:0 0 0 3px #58a6ff55}
  .tl-b.now .tl-t b{color:var(--accent)}

  #detail.replaying .tl-b.past .tl-e{display:none}
  #detail.replaying .tl-b.past{opacity:.5;padding-bottom:1px}
  #detail.replaying .tl-b.fut,#detail.replaying .tl-gap.fut{display:none}
  .tl-c{font-size:9px;line-height:13px;padding:0 4px;border-radius:6px;
        color:#0d1117;font-weight:700;flex:0 0 auto;letter-spacing:.02em}

  #nowCard{position:absolute;top:66px;left:12px;z-index:4;
           max-width:min(470px,calc(100% - 24px));max-height:45%;overflow:auto;
           background:var(--panel);border:1px solid var(--line);
           border-radius:8px;padding:8px 11px 9px;font-size:12px;
           box-shadow:0 4px 14px #0009}
  #nowCard[hidden]{display:none}

  #nowCard .nc-h:first-child{cursor:move;user-select:none}
  #nowCard.fold{padding-bottom:8px}
  #nowCard.fold .nc-g,#nowCard.fold .nc-more{display:none}
  .nc-fold{margin-left:auto;color:var(--dim);font-size:11px;padding-left:8px}
  .nc-h{display:flex;flex-wrap:wrap;gap:4px 9px;align-items:baseline;
        color:var(--dim);font-size:11px}
  .nc-h b{color:var(--accent);font-size:14px;font-variant-numeric:tabular-nums}
  .nc-g{margin-top:7px}
  .nc-r{display:flex;gap:9px;align-items:baseline;padding:3px 0 0 6px}
  .nc-s{color:#fff;font-weight:600;flex:0 0 auto;min-width:62px}
  .nc-n{color:var(--ink);flex:1 1 auto;min-width:0;overflow:hidden;
        text-overflow:ellipsis;white-space:nowrap}
  .nc-v{color:var(--dim);font-size:10px;flex:0 0 auto}
  .nc-new{color:var(--find);font-size:9.5px;text-transform:uppercase;
          letter-spacing:.05em;flex:0 0 auto}

  #player{position:absolute;top:12px;left:12px;z-index:4;
          right:calc(24px + var(--detail-w));
          display:flex;align-items:center;gap:6px;padding:6px 10px;
          background:#0d1117e6;border:1px solid var(--line);border-radius:7px;
          font-size:11px}
  #player[hidden]{display:none}
  #player button{padding:5px 7px;line-height:0}
  #player button svg{width:12px;height:12px;fill:currentColor}
  #plPlay{color:var(--accent);border-color:#58a6ff66}
  #plBar{flex:1 1 120px;min-width:80px;width:auto}
  #plTime{color:var(--dim);white-space:nowrap;overflow:hidden;
          text-overflow:ellipsis;min-width:0;font-variant-numeric:tabular-nums}
  #plTime b{color:#fff;font-weight:600}
  #player select{padding:3px 6px;font-size:11px}
  #plAll,#mapBtn{white-space:nowrap}
  #mapBtn.on{color:var(--accent);border-color:var(--accent)}

  #mapNote{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:4;
           background:#0d1117e6;border:1px solid var(--line);border-radius:7px;
           padding:5px 11px;font-size:11px;color:var(--dim);max-width:60%}
  #mapNote[hidden],#mapBase[hidden]{display:none}
  #mapAttr{position:absolute;right:calc(18px + var(--detail-w));bottom:6px;z-index:3;
           font-size:10px;color:#57606a;background:#ffffffb3;padding:0 5px;border-radius:3px}
  body.dshut #mapAttr{right:10px}
  #mapAttr[hidden]{display:none}
  body.dshut #player{right:24px}

  .tl-e.tke .tl-n{color:var(--find)}
  #tkWinSel[hidden]{display:none}

  #acc{display:inline-flex;align-items:baseline;gap:6px;padding:2px 9px;
       border:1px solid var(--line);border-radius:11px;background:var(--bg);

       min-width:0;flex:0 1 auto;white-space:nowrap;overflow:hidden;
       text-overflow:ellipsis}
  #acc:empty{display:none}
  #acc b{font-variant-numeric:tabular-nums}
  .dimtxt{color:var(--dim);opacity:.8}

  #doc{margin-left:auto;color:var(--dim);font-size:11px;text-decoration:none;
       border:1px solid var(--line);border-radius:11px;padding:2px 9px;
       white-space:nowrap}
  #doc:hover{color:var(--accent);border-color:var(--accent)}
</style>

<header>
  <h1>Alarm Incidents</h1>
  <span class="cnt" id="ccount"></span>
  <span class="cnt" id="acc"></span>

  <span hidden>
    <label id="dayWrap" hidden>day
      <select id="day"></select>
    </label>
    <label>sort
      <select id="sort">

        <option value="tickets" selected>most tickets</option>
        <option value="size">cluster size</option>
        <option value="sites">site count</option>
        <option value="score">best score</option>
      </select>
    </label>
    <label><input type="checkbox" id="crossOnly"> cross-site links only</label>
    <label><input type="checkbox" id="cc"> co-clear links only</label>
    <label id="tkWrap" hidden><input type="checkbox" id="tk"> ticket colours</label>
    <label><input type="checkbox" id="showSites" checked> site nodes</label>
    <label><input type="checkbox" id="d3" checked> 3D layers</label>
    <label><input type="checkbox" id="tidy" checked> rank topology</label>
    <label id="neWrap" hidden title="the floors under the alarms: each site's devices -- transport, RAN (gNB / eNB), cells -- and what each alarm is raised on"><input type="checkbox" id="neStack" checked> device stack</label>
    <button id="relayout">Re-layout</button>
  </span>

  <a id="doc" href="https://github.com/Autophuwit/telecom-alarm-grouping-gnn#readme" target="_blank" rel="noopener"
     title="the project README: what this page is and how the grouping is made">how this works &#8594;</a>
</header>

<main>
  <div id="list">
    <div id="search"><input type="text" id="q" placeholder="find a site or ticket..." autocomplete="off"></div>
    <div id="cards"></div>
  </div>
  <div id="listGrip" class="grip" title="click to hide or show the cluster list ( [ ) &#183; drag to resize it"></div>
  <div id="stage">
    <div id="leafClip"><div id="leaf" hidden></div></div>
    <canvas id="cv"></canvas>
    <div id="mapNote" hidden></div>
    <div id="mapAttr" hidden>map &#169; Esri</div>
    <div id="detailGrip" class="grip" title="click to hide or show the detail panel ( ] ) &#183; drag to resize it"></div>
    <div id="player" hidden>
      <button id="plReset" title="back to the first alarm (Home)"><svg viewBox="0 0 12 12"><path d="M1.5 2h1.6v8H1.5zM7 2v8L3.6 6zM11 2v8L7.6 6z"/></svg></button>
      <button id="plPrev" title="previous moment (&#8592;)"><svg viewBox="0 0 12 12"><path d="M2 2h1.6v8H2zM10 2v8L4 6z"/></svg></button>
      <button id="plPlay" title="play / pause (Space)"></button>
      <button id="plNext" title="next moment (&#8594;)"><svg viewBox="0 0 12 12"><path d="M8.4 2H10v8H8.4zM2 2v8l6-4z"/></svg></button>
      <input type="range" id="plBar" min="0" max="1" step="1" value="1" title="drag to any moment">
      <span id="plTime"></span>
      <select id="plSpeed" title="replay speed">
        <option value="m">by moment</option>
        <option value="5">&#215;5 real time</option>
        <option value="15">&#215;15 real time</option>
        <option value="60">&#215;60 real time</option>
      </select>
      <button id="plAll" title="show every alarm (End)" style="line-height:1.2">show all</button>
      <select id="lines" title="which model pairs to draw. The cluster is the same either way -- this changes the picture, not the grouping">
        <option value="site">site pairs</option>
        <option value="bb">backbone</option>
        <option value="all">all pairs</option>
      </select>
      <select id="tkWinSel" hidden title="tickets: how far a ticket's time may be from an alarm at its site and still join the cluster"></select>
      <button id="mapBtn" title="put the sites at their real coordinates on a street map, under the same 3D layers (M). The map needs internet access." style="line-height:1.2">map</button>
      <select id="mapBase" hidden title="the map under the sites">
        <option value="osm">OpenStreetMap</option>
        <option value="osmdark">OSM dark</option>
        <option value="streets">streets</option>
        <option value="satellite">satellite</option>
        <option value="dark">dark</option>
      </select>
    </div>
    <div id="nowCard" hidden></div>
    <div id="legend" class="min"></div>
    <div id="detail"></div>
    <div id="tip"></div>
    <div id="empty">Select a cluster on the left.</div>
  </div>
</main>

<script>
const G = __PAGE_DATA__;
const DASH='—', ARR='↔', DEG='·';

const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('en-US');

const iso = t => new Date(t*1000).toISOString().replace('T',' ').slice(0,19);
const TZL = 'UTC';

const FAM_COL = {'SITE DOWN': '#c9e265', 'CELL DOWN': '#4fc3f7', 'POWER': '#f0a04b',
  'LINK DOWN': '#56d4c4', 'FTTX': '#ff8f6b', 'RAN X2': '#8c9eff',
  'IP ROUTING': '#3ddc97', 'CLOCK': '#d7b8f3', 'RF HARDWARE': '#e8d5a0',
  'ENVIRONMENT': '#c7a27c', 'MANAGEMENT': '#9aa7b4', 'OTHER': '#6e7681'};
const FAM_COL_LIGHT = {'SITE DOWN': '#6b7d10', 'CELL DOWN': '#0b6fa4', 'POWER': '#b35c00',
  'LINK DOWN': '#0f7f72', 'FTTX': '#c2410c', 'RAN X2': '#3949ab',
  'IP ROUTING': '#15803d', 'CLOCK': '#7e57c2', 'RF HARDWARE': '#8d6e2f',
  'ENVIRONMENT': '#7c4a1e', 'MANAGEMENT': '#4b5563', 'OTHER': '#57606a'};
const catColor = id => FAM_COL[G.strings[id]] || 'hsl(' + ((id*67)%360) + ' 62% 58%)';
const row = (a,b) => '<div class="row"><span>'+a+'</span><span>'+b+'</span></div>';

const esc = s => String(s).replace(/[&<>"']/g,
  ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

function roleTag(s, max){
  if(!s.r || !s.r.length) return '';
  const names = s.r.slice(0, max||2).map(x => G.strings[x[0]]);
  const more = s.r.length - names.length;
  return names.join('+') + (more>0 ? '+'+more : '');
}

const siteLabel = s => { const t = roleTag(s,2); return t ? t+' '+s.n : s.n; };

const ECOL = '#6e7681';

const SPOKE = '#4e8fb0';
const HELD_C = '#8b949e';
const ALC = '#79c0ff';
let platesNow = null;
const M = G.meta;

const NES = G.nes || [], NELINKS = G.nelinks || [];
const HAS_NE = NES.length > 0;
const neFloor = k => k === 'CELL' ? 'C' : k === 'RAN' ? 'R' : 'T';
const NE_COL = {T: '#39c5cf', R: '#ffa657', C: '#ffd8b5'};
const NE_FLOOR_LAB = {T: 'TRANSPORT', R: 'RAN · gNB / eNB', C: 'CELLS'};
const NE_WORDS = {AGG: 'aggregation router (AGG)', AC: 'access router (AC)', CPE: 'cell-site router (CPE)',
  IPRAN: 'IP router', RAN: 'RAN node (gNB / eNB)', CELL: 'cell', BB: 'broadband NE', DWDM: 'DWDM NE',
  OTHER: 'network element'};
const TOWER_C = '#58a6ff', NE_POST_C = '#9fb3c8';
const NE_EDGE = new Set(['nepost', 'necell', 'nelink', 'nex2', 'anc']);
const SUB_STEP = 0.4;
let LIFT = 0, SUBZ = {};
const neR = n => n.fl === 'C' ? 3 : NES[n.ref].k === 'AGG' ? 6.5 : NES[n.ref].k === 'AC' ? 5.5 : n.fl === 'R' ? 5 : 4.5;
const neName = i => G.strings[NES[N[i].ref].n];

const neAlarms = k => clusters[curIdx].al.filter(i => G.alarms[i].ne === k);
function neTip(n){
  const r = NES[n.ref], here = neAlarms(n.ref).length;
  return (NE_WORDS[r.k] || r.k)+' '+G.strings[r.n]+' @ '+G.sites[r.s].n+' '+DEG+' '+
    (here ? here+' alarm'+(here === 1 ? '' : 's')+' on it' : 'no alarm on it in this cluster');
}
const deviceLine = a => a.ne == null ? '' : '<br><span style="color:'+NE_COL[neFloor(NES[a.ne].k)]+'">on '+
  esc(NE_WORDS[NES[a.ne].k] || NES[a.ne].k)+' '+esc(G.strings[NES[a.ne].n])+'</span>';
const ROOT_C = '#f5c518';
const pctS = v => (100*v).toFixed(0)+'%';

const TK = Array.isArray(G.tickets) ? G.tickets : [];
const HAS_TK = TK.length > 0;
const TKM = M.ticket_match || {};
const HAS_RC = TK.some(k => k.rc);
const RC_BY = (M.resolution && M.resolution.by || 'res_tier2').replace(/_/g, ' ');

const RP = M.prediction || null;
const HAS_RP = !!RP && TK.some(k => k.rp);
const RP_MODELS = HAS_RP ? RP.models.filter(s => s.n) : [];
const RP_OK = '#4ade80', RP_BAD = '#f87171', RP_SEP = ' <span style="opacity:.5">&#8250;</span> ';

const HAS_WO = TK.some(k => Array.isArray(k.wo));

const synPairOk = m => m.nj === 2 && m.st != null && m.dc != null ? m.dc <= m.st : null;
function edgeColor(m){
  const sv = ticketMode ? null : synPairOk(m);
  if(sv != null) return sv ? EDGE_OK : EDGE_BAD;
  if(ticketMode){

    if(m.v === 1) return EDGE_OK;
    if(m.v === -1) return EDGE_BAD;
    return ECOL;
  }
  if(!VERIFIED || !judgedE(m)) return ECOL;
  if(m.dc <= tolOf(m)) return EDGE_OK;
  const neg = negOf(m);
  return (neg != null && m.dc > neg) || neg == null ? EDGE_BAD : EDGE_MID;
}

const VIA_HOPS = M.via_hops || 5, VIA_MAX_SITES = 400;
function viaPath(siteSet){
  const via = new Set();
  if(siteSet.size < 2 || siteSet.size > VIA_MAX_SITES || !topoOf.size) return via;
  const comp = new Map(); let nc = 0;
  for(const s0 of siteSet){
    if(comp.has(s0)) continue;
    comp.set(s0, nc);
    const q = [s0];
    while(q.length){
      const v = q.pop();
      for(const o of (topoOf.get(v) || []))
        if(siteSet.has(o) && !comp.has(o)){ comp.set(o, nc); q.push(o); }
    }
    nc++;
  }
  if(nc < 2) return via;
  const par = Array.from({length: nc}, (_, i) => i);
  const fd = x => { while(par[x] !== x){ par[x] = par[par[x]]; x = par[x]; } return x; };

  const live = c0 => [...comp].some(([s, c]) => fd(c) === c0 && (topoOf.get(s) || []).length);
  for(let grew = true; grew;){
    grew = false;
    for(let c0 = 0; c0 < nc; c0++){
      if(fd(c0) !== c0 || !live(c0)) continue;
      const depth = new Map(), prev = new Map(), q = [];
      for(const [s, c] of comp) if(fd(c) === c0){ depth.set(s, 0); q.push(s); }
      let hit = -1;
      for(let qi = 0; qi < q.length && hit < 0; qi++){
        const v = q[qi], dv = depth.get(v);
        if(dv >= VIA_HOPS) continue;
        for(const o of (topoOf.get(v) || [])){
          if(depth.has(o)) continue;
          depth.set(o, dv + 1); prev.set(o, v);
          if(comp.has(o)){ hit = o; break; }
          q.push(o);
        }
      }
      if(hit < 0) continue;
      for(let v = prev.get(hit); depth.get(v) > 0; v = prev.get(v)){
        siteSet.add(v); via.add(v); comp.set(v, c0);
      }
      par[fd(comp.get(hit))] = c0;
      grew = true;
    }
  }
  return via;
}

let curVia = new Set();

function ensureTopoRoots(){
  if(G._troot) return;
  const tp = new Int32Array(G.sites.length);
  for(let i=0;i<tp.length;i++) tp[i] = i;
  const tf = x => { while(tp[x] !== x){ tp[x] = tp[tp[x]]; x = tp[x]; } return x; };
  const tu = (x, y) => { const rx = tf(x), ry = tf(y); if(rx !== ry) tp[rx] = ry; };
  for(const [sa, sb] of (G.topo || [])) tu(sa, sb);
  for(const e of G.edges) if(e.h != null && e.h >= 0) tu(G.alarms[e.i].s, G.alarms[e.j].s);
  G._troot = Int32Array.from(G.alarms, a => tf(a.s));
  G._alat = Float64Array.from(G.alarms, a => {
    const v = G.sites[a.s].lat; return v == null ? NaN : v; });
  G._alon = Float64Array.from(G.alarms, a => {
    const v = G.sites[a.s].lon; return v == null ? NaN : v; });
}

const HOP_LABELS = Array.isArray(M.hop_labels) ? M.hop_labels : [];
function hopLabel(h){
  if(h == null) return DASH;
  if(HOP_LABELS.length)
    return HOP_LABELS[h < 0 ? HOP_LABELS.length - 1
                            : Math.min(h, HOP_LABELS.length - 2)];
  if(h < 0) return 'unreachable';
  return h === 0 ? 'same site' : h + (h === 1 ? ' hop' : ' hops');
}

const R_KM = 6371.0;
function kmA(i, j){
  const la = G._alat, lo = G._alon;
  const p1 = la[i]*Math.PI/180, p2 = la[j]*Math.PI/180;
  const dp = p2 - p1, dl = (lo[j] - lo[i])*Math.PI/180;
  const s = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R_KM*Math.asin(Math.sqrt(Math.min(1, Math.max(0, s))));
}

const ALL_KM_DEFAULT = 40;
let clusters = [], filtered = [], curIdx = -1;

let usedEdges = [];

function buildClusters(){

  let use = G.edges.slice();

  const day = DAYS.length > 1 ? $('day').value : '';
  if(day) use = use.filter(e => dayOf(e.i) === day);

  if($('crossOnly').checked)
    use = use.filter(e => G.alarms[e.i].s !== G.alarms[e.j].s);

  const ccTol = M.coclear_tol_sec;
  if($('cc') && $('cc').checked && ccTol != null)
    use = use.filter(e => !judgedE(e) || e.dc <= tolOf(e));
  const p = new Int32Array(G.alarms.length);
  for(let i=0;i<p.length;i++) p[i] = i;
  const find = x => { while(p[x] !== x){ p[x] = p[p[x]]; x = p[x]; } return x; };

  const cap = M.max_cluster_spread_sec;
  const capOnset = M.max_cluster_onset_sec;
  const capKm = M.max_cluster_no_topo_km;
  const capAll = ('max_cluster_all_km' in M) ? M.max_cluster_all_km
                                             : ALL_KM_DEFAULT;
  const N = G.alarms.length;
  const lo = new Float64Array(N).fill(Infinity);
  const hi = new Float64Array(N).fill(-Infinity);
  const loT = new Float64Array(N).fill(Infinity);
  const hiT = new Float64Array(N).fill(-Infinity);
  for(let i=0;i<N;i++){
    const ct = G.alarms[i].ct;
    if(ct != null){ lo[i] = ct; hi[i] = ct; }
    const t = G.alarms[i].t;
    if(t != null){ loT[i] = t; hiT[i] = t; }
  }
  const spanOK = (a, b, l, h, c) => {
    const mn = Math.min(l[a], l[b]), mx = Math.max(h[a], h[b]);
    return !(mx > mn) || (mx - mn) <= c;
  };

  let troot = null, memOf = null, alat = null;
  if(capKm != null || capAll != null){
    ensureTopoRoots();
    troot = G._troot; alat = G._alat;
    memOf = new Map();
    for(let i=0;i<N;i++) memOf.set(i, [i]);
  }
  const km = kmA;

  const kmOK = (ra, rb) => {
    let A = memOf.get(ra), B = memOf.get(rb);
    if(A.length > B.length){ const t = A; A = B; B = t; }
    for(const a of A){
      if(!isFinite(alat[a])) continue;
      for(const b of B){
        if(!isFinite(alat[b])) continue;
        const related = troot[a] === troot[b];
        if(related && capAll == null) continue;
        const d = km(a, b);
        if(capKm != null && !related && d > capKm) return false;
        if(capAll != null && d > capAll) return false;
      }
    }
    return true;
  };

  if(M.by_incident){
    const first = new Map();
    for(let i=0;i<N;i++){
      const g = G.alarms[i].g;
      if(g == null) continue;
      if(first.has(g)){ const a = find(i), b = find(first.get(g)); if(a !== b) p[a] = b; }
      else first.set(g, i);
    }
  }
  const held = new Set();
  for(const e of use){
    const a = find(e.i), b = find(e.j);
    if(a === b) continue;
    if(cap != null && !spanOK(a, b, lo, hi, cap)){ held.add(e); continue; }
    if(capOnset != null && !spanOK(a, b, loT, hiT, capOnset)){ held.add(e); continue; }
    if(memOf && !kmOK(a, b)){ held.add(e); continue; }
    p[a] = b;
    lo[b] = Math.min(lo[a], lo[b]);
    hi[b] = Math.max(hi[a], hi[b]);
    loT[b] = Math.min(loT[a], loT[b]);
    hiT[b] = Math.max(hiT[a], hiT[b]);
    if(memOf){
      const ma = memOf.get(a), mb = memOf.get(b);
      memOf.set(b, ma.length > mb.length ? ma.concat(mb) : mb.concat(ma));
      memOf.delete(a);
    }
  }

  if(held.size){
    for(const e of [...held]) if(find(e.i) === find(e.j)) held.delete(e);
    use = use.filter(e => !held.has(e));
  }
  usedEdges = use;
  const members = new Map(), byRoot = new Map();
  for(const e of use){
    const r = find(e.i);
    let l = byRoot.get(r); if(!l) byRoot.set(r, l=[]);
    l.push(e);
    for(const x of [e.i, e.j]){
      let m = members.get(find(x)); if(!m) members.set(find(x), m=new Set());
      m.add(x);
    }
  }

  if(M.by_incident){
    for(let i=0;i<N;i++){
      if(!G.alarms[i].tg || G.alarms[i].g == null || (day && dayOf(i) !== day)) continue;
      const r = find(i);
      let m = members.get(r); if(!m) members.set(r, m=new Set());
      m.add(i);
      if(!byRoot.has(r)) byRoot.set(r, []);
    }
  }
  clusters = [];
  for(const [root, es] of byRoot){
    const al = [...(members.get(root) || [])];
    if(al.length < M.min_cluster) continue;
    const siteSet = new Set(al.map(i => G.alarms[i].s));
    let conf=0, contra=0, disc=0, dconf=0, dcontra=0, best=-1e9;
    const cats = new Map();
    for(const e of es){
      if(e.v === 1) conf++; else if(e.v === -1) contra++;
      if(e.r === 0){
        disc++;
        if(e.v === 1) dconf++; else if(e.v === -1) dcontra++;
      }

      if(e.s != null && e.s > best) best = e.s;
    }
    for(const i of al) cats.set(G.alarms[i].c, (cats.get(G.alarms[i].c)||0)+1);
    const badges = [...cats].sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]);

    const alarming = siteSet.size;

    const via = viaPath(siteSet);
    clusters.push({al, es, sites:[...siteSet], nSites: alarming, via,
                   conf, contra, disc, dconf,
                   dcontra, best, badges,
                   labelled: al.some(i => G.alarms[i].l)});
  }
  curIdx = -1;
  $('empty').style.display = '';
  $('detail').innerHTML = '';
}

function verifiedLine(){

  if(ticketMode){
    let k = 0, same = 0;
    for(const e of usedEdges){ if(e.v !== 0){ k++; if(e.v === 1) same++; } }
    if(!k) return '<span class="dimtxt">no pair on this page has a ticket '+
      'at both ends</span>';
    const f = same/k;
    const col = f >= .8 ? 'var(--ok)' : (f >= .5 ? 'var(--topo)' : 'var(--bad)');
    return 'same ticket <b style="color:'+col+'">'+(f*100).toFixed(0)+'</b>'+
      ' of '+k+' judged <span class="dimtxt">('+
      (usedEdges.length-k)+' pairs unticketed &#183; a ticket is a work '+
      'item, not an incident)</span>';
  }
  if(!VERIFIED) return '';
  const tol = M.coclear_tol_sec;

  let known = 0, ok = 0;
  for(const e of usedEdges) if(judgedE(e)){
    known++; if(e.dc <= tolOf(e)) ok++;
  }
  let clean = 0, decided = 0;
  for(const c of clusters){
    let k = 0, a = 0;
    for(const e of c.es) if(judgedE(e)){ k++; if(e.dc <= tolOf(e)) a++; }
    if(k){ decided++; if(a === k) clean++; }
  }
  if(!known)
    return '<span class="dimtxt">no pair on this page has a clear time at '+
      'both ends</span>';
  const f = ok/known;
  const col = f >= .8 ? 'var(--ok)' : (f >= .5 ? 'var(--topo)' : 'var(--bad)');

  const total = usedEdges.length;

  const win = BY_KIND ? 'by kind'
    : tol % 60 === 0 && tol < 3600 ? (tol/60)+'m' : dur(tol);
  const pct = total ? (known/total*100).toFixed(0) : 0;
  $('acc').title = fmt(ok)+' of '+fmt(known)+' judged pairs co-cleared '+
    (BY_KIND ? 'within the tolerance of their alarm kinds (the larger of the '+
               'pair\'s two; click a cluster to see which)'
             : 'within '+dur(tol))+'. '+fmt(known)+' of '+fmt(total)+' pairs ('+pct+
    '%) '+(BY_KIND ? 'have a clear time at both ends and a tolerance for both '+
                     'kinds,' : 'have a clear time at both ends')+
    ' and could be judged. '+clean+' of '+
    decided+' clusters have every judged pair right.';
  return 'accuracy <b style="color:'+col+'">'+(f*100).toFixed(0)+'%</b>'+
    '<span class="dimtxt">'+(BY_KIND ? '' : '&#8804;')+win+'</span>'+
    '<span class="dimtxt">'+DEG+'</span>'+
    '<b>'+fmt(ok)+'/'+fmt(known)+'</b><span class="dimtxt">right</span>'+
    '<span class="dimtxt">'+DEG+'</span>'+
    '<span class="dimtxt">judged</span><b>'+pct+'%</b>'+
    '<span class="dimtxt">of '+fmt(total)+'</span>'+
    '<span class="dimtxt">'+DEG+'</span>'+
    '<b>'+clean+'/'+decided+'</b>'+
    '<span class="dimtxt">clusters clean</span>';
}

function ticketsOf(c){
  if(!HAS_TK) return [];
  if(c._tk && c._tkW === tkWin) return c._tk;
  if(TK_BY_ID){

    const got = new Map();
    for(const i of c.al) for(const k of (tkOfAlarm.get(i) || [])){
      if(!got.has(k)) got.set(k, []);
      got.get(k).push(i);
    }
    const res = [];
    for(const [k, als] of got){

      const own = als.filter(i => G.alarms[i].s === TK[k].s);
      let d = null, a = -1;
      for(const i of (own.length ? own : als)){
        const x = TK[k].t - G.alarms[i].t;
        if(d === null || Math.abs(x) < Math.abs(d)){ d = x; a = i; }
      }
      res.push({k, d, a, als, ownHere: own.length > 0});
    }
    res.sort((x, y) => TK[x.k].t - TK[y.k].t || (TK[x.k].id < TK[y.k].id ? -1 : 1));
    c._tk = res; c._tkW = tkWin;
    return res;
  }
  const at = new Map();
  for(const i of c.al){
    const s = G.alarms[i].s;
    if(!tkBySite.has(s)) continue;
    if(!at.has(s)) at.set(s, []);
    at.get(s).push(i);
  }
  const out = [];
  for(const [s, als] of at) for(const k of tkBySite.get(s)){
    let d = null, a = -1;
    for(const i of als){
      const x = TK[k].t - G.alarms[i].t;
      if(d === null || Math.abs(x) < Math.abs(d)){ d = x; a = i; }
    }

    if(Math.abs(d) <= tkWin) out.push({k, d, a});
  }
  out.sort((x, y) => TK[x.k].t - TK[y.k].t || (TK[x.k].id < TK[y.k].id ? -1 : 1));
  c._tk = out; c._tkW = tkWin;
  return out;
}

function tkRecall(c){
  if(!TK_BY_ID) return null;
  const r = {all: 0, here: 0, other: 0, alone: 0, split: 0};
  for(const x of ticketsOf(c)){
    const k = TK[x.k];
    if(k.na == null) return null;
    const out = Math.max(0, k.na - x.als.length), alone = Math.min(out, k.nz || 0);
    r.all += Math.max(k.na, x.als.length); r.here += x.als.length;
    r.alone += alone; r.other += out - alone;
    if(out) r.split++;
  }
  return r;
}

const WHY_OUT = {

function outsideBlock(n, k){

    row('why', WHY_SHORT.filter(([c]) => cnt[c]).map(([c, l]) => l+' '+cnt[c]).join(' '+DEG+' '));
  for(const o of k.out.slice(0, 12)){

const cv = $('cv'), ctx = cv.getContext('2d'), tip = $('tip');
let cam = {x:0,y:0,k:1}, N = [], E = [], raf = null, ticks = 0;

const DENSE = 120;

const alarmR = o => Math.max(2.6, Math.min(8, 2 + Math.sqrt(o)*1.1));

const siteR  = a => 6;

const ROLE_RANK = {DN:0, GRP:0, GR:0, PN:1, RN:2, AN:2, GM:2, CPE:3};
const RANK_GAP = 126, SIB_GAP = 112, COMP_GAP = 170;
function roleRank(s){
  let best = 4;
  for(const pair of (s.r || [])){
    const v = ROLE_RANK[G.strings[pair[0]]];
    if(v != null && v < best) best = v;
  }
  return best;
}
function tidySites(sites){

  const inC = new Set(sites);
  const nb = new Map(sites.map(
    s => [s, (topoOf.get(s)||[]).filter(o => inC.has(o))]));
  const bfsFar = from => {
    const seen = new Set([from]), q = [from];
    let last = from;
    while(q.length){
      const v = q.shift(); last = v;
      for(const o of nb.get(v)) if(!seen.has(o)){ seen.add(o); q.push(o); }
    }
    return last;
  };

  const rootOf = comp => {
    const roles = comp.map(s => roleRank(G.sites[s]));
    const minR = roles.reduce((a,b) => Math.min(a,b), 4);
    const maxDeg = comp.reduce((a,s) => Math.max(a, nb.get(s).length), 0);
    const pick = ok => comp.filter(ok).sort((a,b) =>
      nb.get(b).length - nb.get(a).length || G.sites[b].a - G.sites[a].a ||
      (G.sites[a].n < G.sites[b].n ? -1 : 1))[0];

    if(minR <= 2 && roles.some(r => r > minR))
      return pick(s => roleRank(G.sites[s]) === minR);

    if(maxDeg >= 3 && maxDeg*2 >= comp.length-1) return pick(() => true);
    return bfsFar(bfsFar(comp[0]));
  };

  const seen = new Set(), comps = [];
  for(const s of sites){
    if(seen.has(s)) continue;
    const comp = [], q = [s];
    seen.add(s);
    while(q.length){
      const v = q.shift(); comp.push(v);
      for(const o of nb.get(v)) if(!seen.has(o)){ seen.add(o); q.push(o); }
    }
    comps.push(comp);
  }
  const solo = comps.filter(x => x.length === 1).map(x => x[0]);
  const trees = comps.filter(x => x.length > 1)
                     .sort((a,b) => b.length - a.length);

  const pos = new Map();
  let ox = 0;
  for(const comp of trees){
    const root = rootOf(comp);
    const rank = new Map([[root,0]]);
    const rows = [[root]];
    const q = [root];
    while(q.length){
      const v = q.shift();
      for(const o of nb.get(v)) if(!rank.has(o)){
        const r = rank.get(v)+1;
        rank.set(o, r);
        (rows[r] || (rows[r] = [])).push(o);
        q.push(o);
      }
    }

    const idx = new Map();
    const reindex = () => rows.forEach(rw => rw.forEach((s,i) => idx.set(s,i)));
    const bary = (s, r) => {
      const ns = nb.get(s).filter(o => rank.get(o) === r);
      return ns.length ? ns.reduce((a,o) => a+idx.get(o), 0)/ns.length
                       : idx.get(s);
    };
    const order = r => {
      const key = new Map(rows[r[0]].map(s => [s, bary(s, r[1])]));
      rows[r[0]].sort((a,b) => key.get(a)-key.get(b) ||
                               (G.sites[a].n < G.sites[b].n ? -1 : 1));
      reindex();
    };
    reindex();
    for(let pass=0; pass<2; pass++){
      for(let r=1;r<rows.length;r++) order([r, r-1]);
      for(let r=rows.length-2;r>=0;r--) order([r, r+1]);
    }

    let lo = Infinity, hi = -Infinity;
    for(let r=0;r<rows.length;r++){
      const want = rows[r].map(s => {
        const ps = nb.get(s).filter(o => rank.get(o) === r-1 && pos.has(o));
        return ps.length ? ps.reduce((a,o) => a+pos.get(o).x, 0)/ps.length
                         : null;
      });
      let x = 0;
      for(let i=0;i<rows[r].length;i++){
        const w = want[i] == null ? (i ? x + SIB_GAP : 0) : want[i];
        x = i === 0 ? w : Math.max(w, x + SIB_GAP);
        pos.set(rows[r][i], {x, y: r*RANK_GAP});
      }
      const asked = want.filter(v => v != null);
      if(asked.length){
        const mid = asked.reduce((a,b) => a+b, 0)/asked.length;
        const got = rows[r].reduce((a,s) => a+pos.get(s).x, 0)/rows[r].length;
        for(const s of rows[r]) pos.get(s).x += mid - got;
      }
      for(const s of rows[r]){
        if(pos.get(s).x < lo) lo = pos.get(s).x;
        if(pos.get(s).x > hi) hi = pos.get(s).x;
      }
    }
    for(const s of comp) pos.get(s).x += ox - lo;
    ox += (hi - lo) + COMP_GAP;
  }

  if(solo.length){
    const cols = Math.ceil(Math.sqrt(solo.length));
    solo.sort((a,b) => G.sites[a].n < G.sites[b].n ? -1 : 1);
    solo.forEach((s,i) => pos.set(s, {x: ox + (i%cols)*SIB_GAP,
                                      y: Math.floor(i/cols)*RANK_GAP}));
  }

  let cx=0, cy=0;
  for(const s of sites){ cx += pos.get(s).x; cy += pos.get(s).y; }
  cx /= sites.length; cy /= sites.length;
  for(const s of sites){ const p = pos.get(s); p.x -= cx; p.y -= cy; }
  return pos;
}

function initSim(){
  const c = clusters[curIdx];
  curVia = c.via || new Set();
  N = []; E = [];
  const localA = new Map(), localS = new Map();
  const nS = c.sites.length;

  const tidy = $('tidy').checked;

  const pos = mapOn ? geoSites(c.sites) : tidy ? tidySites(c.sites) : null;
  sitesPinned = !!pos;
  c.sites.forEach((s,k) => {
    const ang = k/Math.max(1,nS)*6.2832, R = Math.max(45, nS*15);
    const p = pos ? pos.get(s) : {x:Math.cos(ang)*R, y:Math.sin(ang)*R};
    localS.set(s, N.length);
    N.push({x:p.x, y:p.y, vx:0, vy:0,
            fx: pos ? p.x : null, fy: pos ? p.y : null,
            type:'site', ref:s});
  });

  const neNode = new Map();
  SUBZ = {}; LIFT = 0;
  if(HAS_NE && $('neStack').checked){
    const inS = new Set(c.sites), want = new Set(), hot = new Set();
    for(const i of c.al){
      const k = G.alarms[i].ne;
      if(k == null) continue;
      hot.add(k); want.add(k);
      if(NES[k].p != null) want.add(NES[k].p);
    }
    NES.forEach((r, k) => { if(r.st && inS.has(r.s)) want.add(k); });
    const keep = [...want].filter(k => inS.has(NES[k].s)).sort((x, y) => x - y);
    const present = new Set(keep.map(k => neFloor(NES[k].k)));
    let m = 0;
    for(const fl of ['T', 'R', 'C']) if(present.has(fl)) SUBZ[fl] = SUB_STEP*(++m);

    LIFT = m ? SUB_STEP*m - 0.2 : 0;
    const RANK = {AGG:0, AC:1, CPE:2, IPRAN:3, DWDM:4, BB:5, OTHER:6, RAN:7};
    const group = new Map();
    for(const k of keep){
      const fl = neFloor(NES[k].k);
      if(fl === 'C') continue;
      const key = NES[k].s+'|'+fl;
      if(!group.has(key)) group.set(key, []);
      group.get(key).push(k);
    }
    for(const l of group.values()){
      l.sort((x, y) => (RANK[NES[x].k] ?? 9) - (RANK[NES[y].k] ?? 9) ||
                       (G.strings[NES[x].n] < G.strings[NES[y].n] ? -1 : 1));
      const sn = localS.get(NES[l[0]].s), fl = neFloor(NES[l[0]].k);
      l.forEach((k, j) => {
        const R = 8 + 2.5*l.length, ang = j/l.length*6.2832 + (fl === 'R' ? 0.6 : 0);
        const off = l.length === 1 ? {x:0, y:0} : {x: Math.cos(ang)*R, y: Math.sin(ang)*R};
        neNode.set(k, N.length);
        N.push({x:N[sn].x+off.x, y:N[sn].y+off.y, vx:0, vy:0, fx:null, fy:null,
                type:'ne', ref:k, fl, sn, anchor:sn, off, hot: hot.has(k)});
      });
    }

    const cellsOf = new Map();
    for(const k of keep){
      if(neFloor(NES[k].k) !== 'C') continue;
      const pn = NES[k].p != null && neNode.has(NES[k].p) ? neNode.get(NES[k].p) : localS.get(NES[k].s);
      if(!cellsOf.has(pn)) cellsOf.set(pn, []);
      cellsOf.get(pn).push(k);
    }
    for(const [pn, l] of cellsOf){
      l.forEach((k, j) => {
        const r = 7 + 4.5*Math.sqrt(j), ang = j*2.39996;
        const off = {x: Math.cos(ang)*r, y: Math.sin(ang)*r};
        neNode.set(k, N.length);

        N.push({x:N[pn].x+off.x, y:N[pn].y+off.y, vx:0, vy:0, fx:null, fy:null,
                type:'ne', ref:k, fl:'C', sn: N[pn].type === 'ne' ? N[pn].sn : pn, anchor:pn, off, hot: hot.has(k)});
        E.push({a:pn, b:N.length-1, len:0, w:0, kind: N[pn].type === 'ne' ? 'necell' : 'nepost'});
      });
    }

    const tied = new Set();
    for(const [i, j, kd] of NELINKS){
      const a_ = neNode.get(i), b_ = neNode.get(j);
      if(a_ == null || b_ == null) continue;
      E.push({a:a_, b:b_, len:0, w:0, kind: kd === 1 ? 'nex2' : 'nelink'});
      if(kd === 0 && N[a_].sn === N[b_].sn && N[a_].fl !== N[b_].fl)
        tied.add(SUBZ[N[a_].fl] > SUBZ[N[b_].fl] ? a_ : b_);
    }

    for(const k of keep){
      const q = neNode.get(k);
      if(q == null || N[q].fl === 'C' || tied.has(q)) continue;
      E.push({a:N[q].sn, b:q, len:0, w:0, kind:'nepost'});
    }
  }

  const at = i => G.alarms[i].t ?? Infinity;
  const bySite = new Map();
  for(const i of c.al){
    const s = G.alarms[i].s;
    if(!bySite.has(s)) bySite.set(s, []);
    bySite.get(s).push(i);
  }
  for(const l of bySite.values()) l.sort((x, y) => at(x) - at(y));
  const SPIRAL = 11, GOLDEN = 2.39996;
  for(const [s, l] of bySite){
    const sn = localS.get(s), dv = neNode.get(G.alarms[l[0]].ne);
    localA.set(l[0], N.length);
    N.push({x:N[sn].x, y:N[sn].y, vx:0, vy:0, fx:null, fy:null,
            type:'alarm', ref:l[0], sn, anchor:sn, off:null});

    E.push({a: dv != null ? dv : sn, b:N.length-1, len:0, w:0, kind:'spoke', dev: dv != null});

    if(dv != null && N[dv].sn !== sn) E.push({a:sn, b:N.length-1, len:0, w:0, kind:'spoke', home:true});
  }
  for(const [s, l] of bySite){
    const sn = localS.get(s), root = localA.get(l[0]);
    for(let j = 1; j < l.length; j++){
      const r = 10 + SPIRAL*Math.sqrt(j), ang = j*GOLDEN;
      const off = {x: Math.cos(ang)*r, y: Math.sin(ang)*r};
      localA.set(l[j], N.length);
      N.push({x:N[root].x+off.x, y:N[root].y+off.y, vx:0, vy:0, fx:null, fy:null,
              type:'alarm', ref:l[j], sn, anchor:root, off});
      E.push({a:root, b:N.length-1, len:0, w:0, kind:'spoke', branch:true});

      const dv = neNode.get(G.alarms[l[j]].ne);
      if(dv != null && dv !== neNode.get(G.alarms[l[0]].ne))
        E.push({a:dv, b:N.length-1, len:0, w:0, kind:'anc'});
    }
  }
  const bundles = new Map();
  for(const e of c.es){
    const sa = G.alarms[e.i].s, sb = G.alarms[e.j].s;
    if(sa !== sb){
      const key = sa < sb ? sa+':'+sb : sb+':'+sa;
      if(!bundles.has(key)) bundles.set(key, []);
      bundles.get(key).push(E.length);
    }
    E.push({a:localA.get(e.i), b:localA.get(e.j), len:56, w:1, kind:'corr', ref:e});
  }

  const tkOf = i => { const l = G.alarms[i].l;
    return l && l.TICKETID != null ? String(G.strings[l.TICKETID]).split(' ') : []; };
  const byTk = new Map();
  for(const i of c.al) for(const t of tkOf(i)){
    if(!byTk.has(t)) byTk.set(t, []);
    byTk.get(t).push(i);
  }
  for(const i of c.al){
    if(!G.alarms[i].tg) continue;
    let best = null, bd = Infinity;
    for(const t of tkOf(i)){
      const own = (byTk.get(t) || []).filter(j => j !== i);
      const linked = own.filter(j => !G.alarms[j].tg);
      const pool = linked.length ? linked : own.filter(j => at(j) < at(i) || (at(j) === at(i) && j < i));
      for(const j of pool){ const d = Math.abs(at(j) - at(i)); if(d < bd){ bd = d; best = j; } }
    }
    if(best != null) E.push({a:localA.get(best), b:localA.get(i), len:0, w:0, kind:'held'});
  }

  for(const ks of bundles.values()){
    const e0 = E[ks[0]];
    E.push({a:localA.get(first0(e0.ref.i)), b:localA.get(first0(e0.ref.j)),
            len:0, w:0, kind:'bundle', ks});
  }
  function first0(i){ return bySite.get(G.alarms[i].s)[0]; }
  const seen = new Set();
  for(const s of c.sites) for(const o of (topoOf.get(s)||[])){
    if(!localS.has(o)) continue;
    const key = s<o ? s+':'+o : o+':'+s;
    if(seen.has(key)) continue;
    seen.add(key);
    E.push({a:localS.get(s), b:localS.get(o), len:105, w:1.3, kind:'topo'});
  }

  const tkAt = new Map(), synAt = new Map();
  tkSites = new Set();
  for(const x of ticketsOf(c)){

    const k = TK[x.k], sAt = x.als ? G.alarms[x.a].s : k.s, sn = localS.get(sAt);
    if(sn == null) continue;
    tkSites.add(sAt);
    const j = tkAt.get(sAt) || 0;
    tkAt.set(sAt, j + 1);
    const r = 17 + 9*Math.sqrt(j), ang = Math.PI + j*GOLDEN;
    const off = {x: Math.cos(ang)*r, y: Math.sin(ang)*r};
    N.push({x:N[sn].x+off.x, y:N[sn].y+off.y, vx:0, vy:0, fx:null, fy:null,
            type:'ticket', ref:x.k, sn, anchor:sn, off, d:x.d, near:x.a, als:x.als});
    const me = N.length-1;
    const own = (x.als || []).map(i => localA.get(i)).filter(q => q != null);

    const sQ = own.find(q => { const A = G.alarms[N[q].ref];
      return alarmSyn(A) && A.l.TICKETID != null && G.strings[A.l.TICKETID].split(' ').includes(k.id); });
    if(sQ != null)
      for(const q of own) if(q !== sQ && !alarmSyn(G.alarms[N[q].ref]))
        E.push({a: q, b: sQ, len: 0, w: 0, kind: 'synjudge', tk: x.k});

    let to = me;
    if(SYN_LOW && k.syn){
      N.push({x:0, y:0, vx:0, vy:0, fx:null, fy:null, type:'syn', ref:k.syn, tk:x.k,
              cent:[me], off:{x:0, y:0}});
      placeAnchored(N[N.length-1]);
      to = N.length-1;
      E.push({a:to, b:me, len:0, w:0, kind:'tklink', up:true});
    }
    const lk = to === me ? 'tklink' : 'synlink';
    if(own.length) for(const q of own) E.push({a:q, b:to, len:0, w:0, kind:lk, up:true});
    else E.push({a:sn, b:to, len:0, w:0, kind:lk, up:true});
    if(k.syn && !SYN_LOW){
      if(!synAt.has(k.syn)) synAt.set(k.syn, []);
      synAt.get(k.syn).push(N.length-1);
    }
  }

  if(HAS_WO){
    const tkNodes = [];
    N.forEach((n, i) => { if(n.type === 'ticket') tkNodes.push(i); });
    for(const m of tkNodes){
      const ws = TK[N[m].ref].wo || [];
      ws.forEach((w, j) => {
        const r = j ? 11*Math.sqrt(j) : 0, ang = j*GOLDEN;
        N.push({x:0, y:0, vx:0, vy:0, fx:null, fy:null, type:'wo', tk:N[m].ref, w:j,
                cent:[m], off:{x: Math.cos(ang)*r, y: Math.sin(ang)*r}});
        placeAnchored(N[N.length-1]);
        E.push({a:m, b:N.length-1, len:0, w:0, kind:'wolink', up:true});
      });
    }
  }

  if(SYN_LOW){
    const sn = [];
    N.forEach((n, i) => { if(n.type === 'syn' && n.tk != null) sn.push(i); });
    for(let x = 0; x < sn.length; x++) for(let y = x + 1; y < sn.length; y++)
      E.push({a: sn[x], b: sn[y], len: 0, w: 0, kind: 'synsyn'});
  }

  wallBands = [];
  if(HAS_RC){
    const byCat = new Map();
    N.forEach((n, i) => {
      if(n.type !== 'ticket') return;
      const r = rcKey(TK[n.ref]);
      if(!r) return;
      if(!byCat.has(r.name)) byCat.set(r.name, {cause: r.cause, members: []});
      byCat.get(r.name).members.push(i);
    });

    const cats = [...byCat].sort((x, y) => y[1].members.length - x[1].members.length);
    wallBands = cats.map(([name, v]) => ({name, cause: v.cause, members: v.members}));
    wallBands.forEach((b, j) => {
      const r = j ? 16*Math.sqrt(j) : 0, ang = j*GOLDEN;
      N.push({x:0, y:0, vx:0, vy:0, fx:null, fy:null, type:'rc', ref:b.name, cause:b.cause,
              band:j, cent:b.members, off:{x: Math.cos(ang)*r, y: Math.sin(ang)*r}});
      placeAnchored(N[N.length-1]);
      for(const m of b.members) E.push({a:m, b:N.length-1, len:0, w:0, kind:'rcup', up:true});
    });
  }
  let sj = 0;
  for(const [name, members] of synAt){

    const r = sj ? 12*Math.sqrt(sj) : 0, ang = sj*GOLDEN;
    N.push({x:0, y:0, vx:0, vy:0, fx:null, fy:null, type:'syn', ref:name,
            cent:members, off:{x: Math.cos(ang)*r, y: Math.sin(ang)*r}});
    placeAnchored(N[N.length-1]);
    for(const m of members) E.push({a:m, b:N.length-1, len:0, w:0, kind:'synlink'});
    sj++;
  }
  markBackbone();
  nodeOfAlarm = localA;
  ticks = 0;
  if(raf) cancelAnimationFrame(raf);
  step();
}

function markBackbone(){
  const corr = E.filter(e => e.kind === 'corr');
  const late = e => Math.max(G.alarms[N[e.a].ref].t || 0,
                             G.alarms[N[e.b].ref].t || 0);
  corr.sort((x, y) => late(x) - late(y) || y.ref.s - x.ref.s);
  const par = N.map((_, i) => i);
  const find = x => { while(par[x] !== x){ par[x] = par[par[x]]; x = par[x]; }
                      return x; };
  for(const e of corr){
    const ra = find(e.a), rb = find(e.b);
    e.bb = ra !== rb;
    if(e.bb) par[ra] = rb;
  }
  nCorr = corr.length;
  applyLineMode();
}

function applyLineMode(){
  for(const e of E)
    if(e.kind === 'corr') e.w = (lineMode === 'all' || e.bb) ? 1 : 0;
}
const corrHidden = (e, k) =>
  (e.kind === 'corr' && !litE.has(k) &&
   (lineMode === 'site' || (lineMode === 'bb' && !e.bb))) ||
  (e.kind === 'bundle' && lineMode !== 'site');

const bundleShown = e => e.ks.filter(k => edgeShown(E[k]));
function bundleColor(ks){
  const ms = ks.map(k => E[k].ref);
  if(ticketMode){
    if(ms.some(m => m.v === -1)) return ms.some(m => m.v === 1) ? EDGE_MID : EDGE_BAD;
    return ms.some(m => m.v === 1) ? EDGE_OK : ECOL;
  }
  if(!VERIFIED) return ECOL;
  const js = ms.filter(judgedE);
  if(!js.length) return ECOL;
  const f = js.filter(m => m.dc <= tolOf(m)).length / js.length;
  return f === 1 ? EDGE_OK : f >= 0.5 ? EDGE_MID : EDGE_BAD;
}

function placeAnchored(p){
  if(p.cent){
    let x = 0, y = 0;
    for(const m of p.cent){ x += N[m].x; y += N[m].y; }
    p.x = x/p.cent.length + p.off.x; p.y = y/p.cent.length + p.off.y;
    return;
  }
  const q = N[p.anchor];
  p.x = q.x + (p.off ? p.off.x : 0); p.y = q.y + (p.off ? p.off.y : 0);
}
function tick(){
  const t = Math.max(.05, 1 - ticks/200), CELL=32, REP=780;
  const grid = new Map();
  N.forEach((p,i) => {
    const k = (Math.floor(p.x/CELL)+8192)*16384 + (Math.floor(p.y/CELL)+8192);
    let b = grid.get(k); if(!b) grid.set(k, b=[]);
    b.push(i);
  });
  N.forEach((p,i) => {
    const gx=Math.floor(p.x/CELL), gy=Math.floor(p.y/CELL);
    for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++){
      const b = grid.get((gx+dx+8192)*16384 + (gy+dy+8192));
      if(!b) continue;
      for(const j of b){
        if(j===i) continue;
        const q = N[j];

        if(q.type !== p.type) continue;
        let ux=p.x-q.x, uy=p.y-q.y, d2=ux*ux+uy*uy;
        if(d2 > CELL*CELL*4) continue;
        if(d2 < .02){ ux=Math.random()-.5; uy=Math.random()-.5; d2=.02; }

        const d=Math.sqrt(d2), f=Math.min(REP/d2, 48)*t;
        p.vx += ux/d*f; p.vy += uy/d*f;
      }
    }
  });
  for(const e of E){
    const p=N[e.a], q=N[e.b];
    const ux=q.x-p.x, uy=q.y-p.y, d=Math.hypot(ux,uy)||1e-6;
    const f=(d-e.len)*.02*e.w*t;
    p.vx += ux/d*f; p.vy += uy/d*f; q.vx -= ux/d*f; q.vy -= uy/d*f;
  }
  for(const p of N){
    if(p.fx!=null){ p.x=p.fx; p.y=p.fy; p.vx=0; p.vy=0; continue; }

    if(p.anchor!=null || p.cent || p.wall){ placeAnchored(p); p.vx=0; p.vy=0; continue; }
    p.vx*=.82; p.vy*=.82; p.x+=p.vx; p.y+=p.vy;

    if(!sitesPinned){ p.x*=1-.003*t; p.y*=1-.003*t; }
  }
}
function step(){
  for(let i=0;i<3 && ticks<200;i++,ticks++) tick();
  draw();
  raf = ticks<200 ? requestAnimationFrame(step) : null;
}
function resize(){
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  placeNow();
  draw();
}

let view3d = true;

let yaw  = Math.PI/4;
let elev = 0.45;

let LAYER_H = 100;
const LAYER_FRACTION = 0.30, LAYER_MIN = 45, LAYER_MAX = 135;

const SYN_LOW = !!TKM.synthetic_below;
const TK_Z = SYN_LOW ? 2.6 : 1.8, SYN_Z = SYN_LOW ? 1.8 : 2.6;
const TKC = '#bc8cff', SYNC = '#f778ba';

const RC_Z = Math.max(TK_Z, SYN_Z) + 0.8;
const WO_Z = (HAS_RC ? RC_Z : Math.max(TK_Z, SYN_Z)) + 0.8, WOC = '#2dd4bf', WO_NONE = '#6e7681', WO_R = 5;

const RCC = '#e3b341', RC_NONE = '#6e7681', RC_R = 4.5, WALL_GAP = 90;
let wallBands = [];

const rcR = n => RC_R + 1.6*Math.sqrt(Math.max(0, wallBands[n.band].members.length - 1));
const RC_TIER = (+((/(\d)\s*$/.exec(RC_BY) || [0, 2])[1])) - 1;

function rcKey(k){
  if(k.rj) return {name: k.rj, cause: true};
  if(k.rc) return {name: k.rc[RC_TIER] || '(blank)', cause: false};
  return null;
}
function alarmSyn(a){ return !!(a && a.l && a.l.SYNTHETIC != null); }

function synAlarmHere(n){
  const c = clusters[curIdx], id = TK[n.tk].id;
  if(!c) return null;
  for(const i of c.al){
    const a = G.alarms[i];
    if(alarmSyn(a) && a.l.TICKETID != null && G.strings[a.l.TICKETID].split(' ').includes(id)) return i;
  }
  return null;
}

function synWhere(n){
  if(synAlarmHere(n) != null) return 'in this cluster (pink, on the alarm layer)';
  const w = TK[n.tk].sw;
  return w === 'cl' ? 'in another cluster'
    : w === 'alone' ? 'in no cluster: the model linked it to nothing'
    : w === 'none' ? '<span style="color:var(--dim)">not among the day\'s graph alarms (no place, or it did not fire this day)</span>'
    : DASH;
}

function clearVerdict(ca, cb, tols, flatOk){
  if(ca == null || cb == null) return null;
  const ts = tols.filter(v => v != null);
  const flat = !ts.length;
  const tol = !flat ? Math.max(...ts) : (flatOk || !M.coclear_by_kind ? M.coclear_tol_sec : null);
  if(tol == null) return null;
  const dc = Math.abs(ca - cb);
  return {dc, tol, ok: dc <= tol, flat};
}
function synJudgeInfo(e){
  if(e.kind === 'synjudge'){
    const A = G.alarms[N[e.a].ref], S = G.alarms[N[e.b].ref];
    return clearVerdict(A.ct, S.ct, [A.tol, S.tol], false);
  }
  if(e.kind === 'synsyn'){
    const a = TK[N[e.a].tk], b = TK[N[e.b].tk];
    return clearVerdict(a.sc, b.sc, [a.stl, b.stl], true);
  }
  return null;
}

const zOf = n => !view3d ? 0
  : n.type === 'ne' ? LAYER_H*(SUBZ[n.fl] || 0)
  : n.type === 'alarm' ? LAYER_H*(1+LIFT)
  : n.type === 'ticket' ? LAYER_H*(TK_Z+LIFT)
  : n.type === 'syn' ? LAYER_H*(SYN_Z+LIFT)
  : n.type === 'rc' ? LAYER_H*(RC_Z+LIFT)
  : n.type === 'wo' ? LAYER_H*(WO_Z+LIFT) : 0;

function layoutBox(){
  let x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity;
  for(const n of N){
    if(n.wall) continue;
    if(n.x<x0) x0=n.x;
    if(n.x>x1) x1=n.x;
    if(n.y<y0) y0=n.y;
    if(n.y>y1) y1=n.y;
  }
  return {x0, y0, x1, y1, span: Math.max(x1-x0, y1-y0, 1)};
}

function scrXYZ(x, y, z){
  const cw = view3d ? Math.cos(yaw)  : 1, sw = view3d ? Math.sin(yaw)  : 0;
  const ce = view3d ? Math.cos(elev) : 0, se = view3d ? Math.sin(elev) : 1;
  const dx = x - cam.x, dy = y - cam.y;
  const rx = dx*cw - dy*sw, ry = dx*sw + dy*cw;
  return {x: rx*cam.k + cv.clientWidth/2,
          y: (ry*se - z*ce)*cam.k + cv.clientHeight/2};
}
const scr = p => scrXYZ(p.x, p.y, zOf(p));

let litN = new Set(), litE = new Set(), focusNow = null, dimA = 1;

function plateList(box){
  const pad = 36;
  const {x0, y0, x1, y1} = box;
  const corners = [[x0-pad,y0-pad],[x1+pad,y0-pad],
                   [x1+pad,y1+pad],[x0-pad,y1+pad]];
  const L = [{z: 0, col: '#8b949e', base: '#11161d', edge: '#30363d', lab: 'SITES · topology'},
             {z: LAYER_H*(1+LIFT), col: ALC, lab: 'ALARMS · model pairs'}];

  for(const fl in SUBZ) L.push({z: LAYER_H*SUBZ[fl], col: NE_COL[fl], lab: NE_FLOOR_LAB[fl], dev: true});

  if(N.some(n => n.type === 'ticket')) L.push({z: LAYER_H*(TK_Z+LIFT), col: TKC, lab: 'TICKETS'});
  if(N.some(n => n.type === 'syn')) L.push({z: LAYER_H*(SYN_Z+LIFT), col: SYNC, lab: 'SYNTHETIC ALARMS'});
  if(N.some(n => n.type === 'rc'))
    L.push({z: LAYER_H*(RC_Z+LIFT), col: RCC, lab: 'RESOLUTION · '+RC_BY.replace('Resolution Category ', '').toLowerCase()});
  if(N.some(n => n.type === 'wo')) L.push({z: LAYER_H*(WO_Z+LIFT), col: WOC, lab: 'WORK ORDERS'});
  L.sort((a, b) => a.z - b.z);
  for(const p of L) p.q = corners.map(([x,y]) => scrXYZ(x, y, p.z));
  return L;
}
function drawPlates(box){
  const L = plateList(box);
  const path = pts => {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
  };
  ctx.setLineDash([]); ctx.lineWidth = 1;
  L.forEach((p, k) => {
    if(k){
      ctx.globalAlpha = 1; ctx.strokeStyle = '#30363d';
      for(let i=0;i<4;i++){
        ctx.beginPath();
        ctx.moveTo(L[k-1].q[i].x, L[k-1].q[i].y); ctx.lineTo(p.q[i].x, p.q[i].y);
        ctx.stroke();
      }
    }
    path(p.q);
    if(p.base){
      ctx.globalAlpha = 1; ctx.fillStyle = p.base; ctx.fill();
      ctx.strokeStyle = p.edge; ctx.stroke();
    } else if(p.dev){

      ctx.globalAlpha = .035; ctx.fillStyle = p.col; ctx.fill();
      ctx.globalAlpha = .3; ctx.strokeStyle = p.col; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
    } else {
      ctx.globalAlpha = .07; ctx.fillStyle = p.col; ctx.fill();
      ctx.globalAlpha = .5; ctx.strokeStyle = p.col; ctx.stroke();
    }
  });
  ctx.globalAlpha = 1;
  platesNow = L;

  wallNow = null;
}
let wallNow = null;

function drawWallLabel(){

  if(wallBands.length){
    const placed = [];
    ctx.save();
    ctx.setLineDash([]); ctx.lineJoin = 'round';
    ctx.font = '10.5px ui-monospace,monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const side = $('detail').getBoundingClientRect(), cvr = cv.getBoundingClientRect();
    const edgeX = (side.width > 0 && side.left > cvr.left
                   ? Math.min(cv.clientWidth, side.left - cvr.left) : cv.clientWidth) - 6;
    for(let i = 0; i < N.length; i++){
      const n = N[i];
      if(n.type !== 'rc' || !nodeShown(n)) continue;
      const b = wallBands[n.band], p = scr(n), r = rcR(n);
      const txt = (b.name.length > 40 ? b.name.slice(0, 39)+'…' : b.name)+'  '+b.members.length;
      const w = ctx.measureText(txt).width;
      const x = p.x + r + 6 + w > edgeX ? p.x - r - 6 - w : p.x + r + 6;
      ctx.globalAlpha = (!focusNow || litN.has(i)) ? 1 : .25;
      let y = p.y;
      while(placed.some(v => Math.abs(v - y) < 13)) y += 13;
      placed.push(y);
      ctx.lineWidth = 3; ctx.strokeStyle = onLight() ? '#ffffffe6' : '#0d1117d9';
      ctx.strokeText(txt, x, y);
      ctx.fillStyle = b.cause ? RCC : RC_NONE;
      ctx.fillText(txt, x, y);
    }
    ctx.restore();
  }
  if(!wallNow) return;
  let [a, b] = [wallNow.q[3], wallNow.q[2]];
  if(b.x < a.x) [a, b] = [b, a];
  if(Math.hypot(b.x - a.x, b.y - a.y) < 20) return;
  const fs = 12*cam.k;
  if(fs < 5) return;
  const sc_ = Math.min(fs, 32)/12;
  ctx.save();
  ctx.setLineDash([]); ctx.lineJoin = 'round';
  ctx.font = '600 '+(12*sc_).toFixed(1)+'px system-ui,-apple-system,"Segoe UI",sans-serif';
  ctx.translate(a.x, a.y); ctx.rotate(Math.atan2(b.y - a.y, b.x - a.x));
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.globalAlpha = .9; ctx.lineWidth = 4*sc_; ctx.strokeStyle = '#0d1117';
  ctx.strokeText(wallNow.lab, 14*sc_, 4*sc_);
  ctx.globalAlpha = 1; ctx.fillStyle = wallNow.col;
  ctx.fillText(wallNow.lab, 14*sc_, 4*sc_);
  ctx.restore();
}

function drawPlateLabels(){
  if(!platesNow) return;
  platesNow.forEach((p, k) => {
    const q = p.q;

    let f = 0;
    for(let i=1;i<4;i++) if(q[i].y > q[f].y) f = i;
    const e1 = [q[f], q[(f+1)%4]], e2 = [q[(f+3)%4], q[f]];
    const L_ = e => Math.hypot(e[1].x - e[0].x, e[1].y - e[0].y);
    let [a, b] = L_(e1) >= L_(e2) ? e1 : e2;
    if(b.x < a.x) [a, b] = [b, a];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    if(len < 20) return;
    const th = Math.atan2(b.y - a.y, b.x - a.x);
    const cx = q.reduce((s, v) => s + v.x, 0)/4, cy = q.reduce((s, v) => s + v.y, 0)/4;

    const out = -Math.sin(th)*((a.x + b.x)/2 - cx) + Math.cos(th)*((a.y + b.y)/2 - cy) > 0;
    const right = false;
    ctx.save();
    ctx.setLineDash([]); ctx.lineJoin = 'round';
    if('letterSpacing' in ctx) ctx.letterSpacing = '0.6px';

    const fs = 12*cam.k;
    if(fs < 5){ ctx.restore(); return; }
    const sc_ = Math.min(fs, 32)/12;
    ctx.font = '600 '+(12*sc_).toFixed(1)+'px system-ui,-apple-system,"Segoe UI",sans-serif';
    ctx.translate(right ? b.x : a.x, right ? b.y : a.y);
    ctx.rotate(th);
    ctx.textAlign = right ? 'right' : 'left';

    ctx.textBaseline = out ? 'bottom' : 'top';
    const tx = (right ? -14 : 14)*sc_, ty = (out ? -4 : 4)*sc_;
    ctx.globalAlpha = .9; ctx.lineWidth = 4*sc_; ctx.strokeStyle = '#0d1117';
    ctx.strokeText(p.lab, tx, ty);
    ctx.globalAlpha = 1; ctx.fillStyle = p.col;
    ctx.fillText(p.lab, tx, ty);
    ctx.restore();
  });
}

function arrowAt(p, q, size, color, alpha){
  const dx = q.x-p.x, dy = q.y-p.y, d = Math.hypot(dx, dy);
  if(d < size*3) return;
  const ux = dx/d, uy = dy/d;
  const mx = p.x + dx*0.5, my = p.y + dy*0.5;
  const bx = mx - ux*size*0.7, by = my - uy*size*0.7;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(mx + ux*size, my + uy*size);
  ctx.lineTo(bx - uy*size*0.62, by + ux*size*0.62);
  ctx.lineTo(bx + uy*size*0.62, by - ux*size*0.62);
  ctx.closePath();
  ctx.fill();
}

function drawTowers(){
  if(!view3d) return;
  const cols = new Map();
  for(const n of N){
    if(n.type !== 'ne') continue;
    const s = N[n.sn];
    if(!s) continue;
    const t = cols.get(n.sn) || {w: 0, top: 0};
    t.w = Math.max(t.w, Math.abs(n.x - s.x), Math.abs(n.y - s.y));
    t.top = Math.max(t.top, zOf(n));
    cols.set(n.sn, t);
  }
  ctx.save();
  ctx.setLineDash([]); ctx.lineWidth = 1;
  for(const [sn, t] of cols){

    const s = N[sn], w = Math.min(t.w, 45) + 10, z1 = t.top + 10, lit = !focusNow || litN.has(sn);
    const sq = [[-w,-w],[w,-w],[w,w],[-w,w]];
    const c0 = sq.map(([dx, dy]) => scrXYZ(s.x+dx, s.y+dy, 0));
    const c1 = sq.map(([dx, dy]) => scrXYZ(s.x+dx, s.y+dy, z1));
    ctx.globalAlpha = lit ? .05 : .015; ctx.fillStyle = TOWER_C;
    for(let i=0;i<4;i++){
      const j = (i+1)%4;
      ctx.beginPath();
      ctx.moveTo(c0[i].x, c0[i].y); ctx.lineTo(c0[j].x, c0[j].y);
      ctx.lineTo(c1[j].x, c1[j].y); ctx.lineTo(c1[i].x, c1[i].y); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = lit ? .5 : .12; ctx.strokeStyle = TOWER_C;
    ctx.beginPath();
    for(const c of [c0, c1]){
      ctx.moveTo(c[0].x, c[0].y);
      for(let i=1;i<4;i++) ctx.lineTo(c[i].x, c[i].y);
      ctx.closePath();
    }
    for(let i=0;i<4;i++){ ctx.moveTo(c0[i].x, c0[i].y); ctx.lineTo(c1[i].x, c1[i].y); }
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

    if(n++ >= NOW_LABEL_MAX) break;
    const p = scr(nd), r = isTk ? TK_R : isSy ? SYN_R : alarmR(a.o);

    const txt = isTk ? String(TK[nd.ref].id) : isSy ? String(nd.ref) : catLabel(G.strings[a.c]);
    const edge = isTk ? TKC : isSy ? SYNC : alarmInk(a.c);
    const w = ctx.measureText(txt).width + 12;

    const side = $('detail').getBoundingClientRect(), cvr = cv.getBoundingClientRect();
    const edgeX = (side.width > 0 && side.left > cvr.left
                   ? Math.min(cv.clientWidth, side.left - cvr.left) : cv.clientWidth) - 6;
    let x = p.x + r + 6 + w > edgeX ? p.x - r - 6 - w : p.x + r + 6, y = p.y - H/2;
    for(let tries = 0; tries < 12 &&
        placed.some(b => x < b.x + b.w && x + w > b.x && y < b.y + H && y + H > b.y);
        tries++) y += H + 2;
    placed.push({x, y, w});
    ctx.globalAlpha = 1;
    if(Math.abs(y + H/2 - p.y) > 2){
      const right = x > p.x;
      ctx.strokeStyle = edge; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(p.x + (right ? r : -r), p.y);
      ctx.lineTo(right ? x : x + w, y + H/2); ctx.stroke();
    }
    ctx.fillStyle = light ? '#ffffffeb' : '#0d1117e6';
    ctx.strokeStyle = edge; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, w, H, 4) : ctx.rect(x, y, w, H);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = light ? '#1f2328' : '#e6edf3';
    ctx.fillText(txt, x + 6, y + H - 4.5);
  }
}

function segDist(mx,my,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1, L2=dx*dx+dy*dy;
  if(!L2) return Math.hypot(mx-x1,my-y1);
  let t=((mx-x1)*dx+(my-y1)*dy)/L2; t=Math.max(0,Math.min(1,t));
  return Math.hypot(mx-(x1+t*dx), my-(y1+t*dy));
}
function pick(mx,my){
  const showSites = $('showSites').checked;
  for(let i=N.length-1;i>=0;i--){
    const n=N[i];
    if((n.type==='site' || n.type==='ne') && !showSites) continue;
    if(!nodeShown(n)) continue;
    const p=scr(n);
    const r = (n.type==='site' ? siteR(G.sites[n.ref].a) : n.type==='ne' ? neR(n)
             : n.type==='ticket' ? TK_R : n.type==='syn' ? SYN_R : n.type==='rc' ? rcR(n)
             : n.type==='wo' ? WO_R
             : alarmR(G.alarms[n.ref].o)) + 4;
    if((p.x-mx)**2+(p.y-my)**2 < r*r) return {kind:'node', i};
  }
  let best=null, bd=6;
  for(let k=0;k<E.length;k++){
    const e=E[k];
    if((e.kind==='topo'||e.kind==='spoke'||NE_EDGE.has(e.kind)) && !showSites) continue;
    if(!edgeShown(e) || corrHidden(e, k)) continue;
    if(e.kind === 'bundle' && !bundleShown(e).length) continue;
    const p=scr(N[e.a]), q=scr(N[e.b]);
    const d=segDist(mx,my,p.x,p.y,q.x,q.y);
    if(d<bd){ bd=d; best={kind:'edge', i:k}; }
  }
  return best;
}

function worldOf(mx, my, z){
  const cw = view3d ? Math.cos(yaw)  : 1, sw = view3d ? Math.sin(yaw)  : 0;
  const ce = view3d ? Math.cos(elev) : 0, se = view3d ? Math.sin(elev) : 1;
  const rx = (mx - cv.clientWidth/2)/cam.k;
  const ry = ((my - cv.clientHeight/2)/cam.k + z*ce)/se;
  return {x: cam.x + rx*cw + ry*sw, y: cam.y - rx*sw + ry*cw};
}

function dur(s){
  s = Math.round(Math.abs(s));
  if(s < 60) return s+' s';
  if(s < 3600) return Math.floor(s/60)+'m '+(s%60)+'s';
  if(s < 86400) return Math.floor(s/3600)+'h '+Math.floor((s%3600)/60)+'m';
  return Math.floor(s/86400)+'d '+Math.floor((s%86400)/3600)+'h';
}

function blastOf(c){
  ensureTopoRoots();
  const A = G.alarms, lat = G._alat, troot = G._troot;
  const ord = c.al.slice().sort((x,y) => (A[x].t - A[y].t) || (x - y));

  const rep = new Map();
  for(const i of ord) if(!rep.has(A[i].s)) rep.set(A[i].s, i);
  const sIdx = [...rep.values()];
  const geo = sIdx.filter(i => isFinite(lat[i]));

  const epi = ord.find(i => isFinite(lat[i]));
  const out = {ord, nSites: sIdx.length, nGeo: geo.length,
               epiIsFirst: epi === ord[0], epi: epi};
  if(epi === undefined) return out;

  let reach = 0, far = epi;
  const dists = [];
  for(const i of geo){
    const d = kmA(epi, i);
    dists.push(d);
    if(d > reach){ reach = d; far = i; }
  }
  let span = 0, spanPair = null, noTopo = 0, noTopoPair = null;
  for(let a=0;a<geo.length;a++) for(let b=a+1;b<geo.length;b++){
    const d = kmA(geo[a], geo[b]);
    if(d > span){ span = d; spanPair = [geo[a], geo[b]]; }
    if(troot[geo[a]] !== troot[geo[b]] && d > noTopo){
      noTopo = d; noTopoPair = [geo[a], geo[b]];
    }
  }

  const growth = [];
  let run = -1;
  for(const i of ord){
    if(!isFinite(lat[i])) continue;
    const d = kmA(epi, i);
    if(d > run){ run = d; growth.push([A[i].t, run]); }
  }
  if(growth.length) growth.push([A[ord[ord.length-1]].t, run]);

  const radius = span / 2;
  return Object.assign(out, {radius, reach, far, span, spanPair, noTopo,
                             noTopoPair, dists, growth});
}

function growthSVG(g, mx){
  const W = 318, H = 46, P = 4, BASE = H - 12, TOP = 5;
  const t0 = g[0][0], t1 = g[g.length-1][0], sp = Math.max(1, t1 - t0);
  const span = Math.max(mx, 0.05);
  const X = t => P + (t - t0)/sp*(W - P*2);
  const Y = r => BASE - r/span*(BASE - TOP);
  let d = 'M'+X(t0).toFixed(1)+' '+Y(g[0][1]).toFixed(1);
  let py = Y(g[0][1]);
  for(let k=1;k<g.length;k++){
    const nx = X(g[k][0]).toFixed(1), ny = Y(g[k][1]);
    d += 'L'+nx+' '+py.toFixed(1);
    if(ny !== py){ d += 'L'+nx+' '+ny.toFixed(1); py = ny; }
  }
  return '<svg class="viz" viewBox="0 0 '+W+' '+H+'">'+
    '<path d="'+d+'L'+X(t1).toFixed(1)+' '+BASE+'L'+X(t0).toFixed(1)+' '+BASE+
      'Z" fill="#58a6ff" fill-opacity=".13"/>'+
    '<path d="'+d+'" fill="none" stroke="#58a6ff" stroke-width="1.6"/>'+
    '<line x1="'+P+'" y1="'+BASE+'" x2="'+(W-P)+'" y2="'+BASE+
      '" stroke="#21262d" stroke-width="1"/>'+
    '<text x="'+P+'" y="'+(H-2)+'" fill="#7d8590" font-size="9">T+0</text>'+
    '<text x="'+(W-P)+'" y="'+(H-2)+'" fill="#7d8590" font-size="9" '+
      'text-anchor="end">'+dur(t1-t0)+'</text></svg>';
}
function blastBlock(c){
