const TL_BURSTS = 25;
let tlAll = false;

const ACRO = new Set(['NE','UMTS','GSM','LTE','NR','BTS','BN','EMS','OLT','ONU',
  'ONT','PON','IP','BFD','OSPF','BGP','LOS','LOF','RX','TX','DDM','CPU','AC',
  'DC','SFP','VSWR','RRU','BBU','RF','GPS','SDH','MW','NMS','FTTH','ETPI',
  'ETH','LAN','WAN','VPN','MPLS','LSP','PW','CE','PE','OMC','X2','S1']);
const CASED = {NODEB:'NodeB', ENODEB:'eNodeB', GNODEB:'gNodeB',
               UTRANCELL:'UtranCell', EUTRANCELL:'EUtranCell'};
const nameCache = new Map();
function shortName(full){
  if(nameCache.has(full)) return nameCache.get(full);
  const m = /^([A-Z0-9]+)-([A-Z0-9]+)-(.+)$/i.exec(full);
  let rest = (m ? m[3] : full)
    .replace(/MORETHAN(\d+)PER(CENT)?/gi, '_>$1%')
    .replace(/LESSTHAN(\d+)PER(CENT)?/gi, '_<$1%')
    .replace(/(CELL|SITE|LINK|PORT)DOWN/gi, '$1_DOWN')
    .replace(/SERVICEUNAVAIL/gi, 'SERVICE_UNAVAIL');
  let s = rest.split(/[_\s]+/).filter(Boolean).map(w => {
    const u = w.toUpperCase();
    if(CASED[u]) return CASED[u];
    if(ACRO.has(u) || /\d|[()%<>]/.test(w)) return w;
    return w.toLowerCase();
  }).join(' ');
  s = s.charAt(0).toUpperCase() + s.slice(1);

  const v = !m ? '' : m[1].length <= 3 ? m[1].toUpperCase()
                    : m[1].charAt(0) + m[1].slice(1).toLowerCase();
  const out = {name: s, vendor: v};
  nameCache.set(full, out);
  return out;
}

const catShort = c => G.strings[c].replace(/_DOWN$/, '')
                                  .replace(/^MAINPOWER$/, 'POWER');
function ticketOf(a){
  if(!a.l) return '';
  const keys = Object.keys(a.l);
  const k = keys.find(x => /ticket|inc/i.test(x)) || keys[0];
  return k ? G.strings[a.l[k]] : '';
}
function seqBlock(c){
  const A = G.alarms;
  const ord = c.al.slice().sort((x,y) => (A[x].t - A[y].t) || (x - y));

  const byT = new Map();
  const at = t => { if(!byT.has(t)) byT.set(t, {t, al: [], tk: []}); return byT.get(t); };
  for(const i of ord) at(A[i].t).al.push(i);
  for(const x of ticketsOf(c)) at(TK[x.k].t).tk.push(x);
  const bursts = [...byT.values()].sort((x, y) => x.t - y.t);
  const t0 = bursts[0].t, tN = bursts[bursts.length-1].t;
  const firstAl = bursts.find(b => b.al.length);
  const nTk = ticketsOf(c).length;
  const shown = tlAll ? bursts : bursts.slice(0, TL_BURSTS);
  let h = '<h2>Sequence</h2>'+
    '<div class="cap">'+fmt(bursts.length)+' moment'+
      (bursts.length===1?'':'s')+' over '+dur(tN-t0)+' '+DEG+' first at '+
      iso(t0)+' '+TZL+'</div><div class="tl">';
  let prev = null;
  for(const b of shown){

    if(prev !== null && b.t - prev >= 60)
      h += '<div class="tl-gap" data-t="'+b.t+'">'+dur(b.t - prev)+
        ' later</div>';
    h += '<div class="tl-b'+(b===firstAl?' first':'')+'" data-t="'+b.t+'">'+
      '<div class="tl-t"><b>T+'+(b.t===t0 ? '0s' : dur(b.t-t0))+'</b>'+
      '<span>'+iso(b.t).slice(11)+'</span>'+
      (b===firstAl ? '<span class="tl-tag">first alarm</span>' : '')+
      (b.al.length>1 ? '<span>'+DEG+' '+b.al.length+' together</span>' : '')+
      (!b.al.length ? '<span class="tl-tag" style="color:var(--find)">ticket</span>' : '')+
      '</div>';
    for(const i of b.al){
      const a = A[i], tk = ticketOf(a), n = G.strings[a.n];
      h += '<div class="tl-e" data-a="'+i+'" title="'+esc(n)+' @ '+
        esc(G.sites[a.s].n)+'">'+
        '<span class="tl-c" style="background:'+catColor(a.c)+'">'+
          esc(catShort(a.c))+'</span>'+
        '<span class="tl-s">'+esc(G.sites[a.s].n)+'</span>'+
        '<span class="tl-n">'+esc(shortName(n).name)+
          (a.o>1 ? ' '+DEG+' '+a.o+'x' : '')+
        '</span>'+(tk ? '<span class="tl-tk">'+esc(tk)+'</span>' : '')+
        '</div>';
    }
    for(const x of b.tk){
      const k = TK[x.k];
      h += '<div class="tl-e tke" data-k="'+x.k+'" title="ticket '+esc(k.id)+' @ '+
        esc(G.sites[k.s].n)+(k.syn ? ' '+DEG+' '+esc(k.syn) : '')+'">'+
        '<span class="tl-c" style="background:'+TKC+'">TKT</span>'+
        '<span class="tl-s">'+esc(G.sites[k.s].n)+'</span>'+
        '<span class="tl-n">'+esc(k.id)+'</span>'+
        '<span class="tl-tk" title="ticket time minus the nearest alarm at this site">'+
          sgn(x.d)+'</span></div>';
    }
    h += '</div>';
    prev = b.t;
  }
  h += '</div>';
  if(bursts.length > shown.length)
    h += '<div class="tl-more" id="tlmore">show all '+fmt(bursts.length)+
      ' moments '+DEG+' '+fmt(c.al.length)+' alarms'+
      (nTk ? ' '+DEG+' '+nTk+' ticket'+(nTk === 1 ? '' : 's') : '')+'</div>';
  else if(tlAll && bursts.length > TL_BURSTS)
    h += '<div class="tl-more" id="tlmore">collapse to first '+
      TL_BURSTS+'</div>';
  return h;
}

function wireDetail(){
  for(const el of $('detail').querySelectorAll('.tl-e')){
    el.onclick = () => {

      const ni = el.dataset.k != null
        ? N.findIndex(n => n.type === 'ticket' && n.ref === +el.dataset.k)
        : nodeOfAlarm.get(+el.dataset.a);
      if(ni == null || ni < 0) return;
      for(const o of $('detail').querySelectorAll('.tl-e.on'))
        o.classList.remove('on');
      el.classList.add('on');

      sel = {kind:'node', i:ni};
      if(!raf) draw();
    };
  }
  const more = $('tlmore');
  if(more) more.onclick = () => { tlAll = !tlAll; showCluster(); };
  const back = $('tlback');
  if(back) back.onclick = () => { sel = null; showCluster(); if(!raf) draw(); };
  seqK = null; syncSeq(false);
}

const backLink = () =>
  '<div class="tl-more" id="tlback" style="margin:0 0 9px">'+
  '&#8592; back to the cluster</div>';

function coclearRow(c){
  if(!VERIFIED) return '';
  const js = c.es.filter(judgedE);
  if(!js.length)
    return row('Alarm co-clear', '<span style="opacity:.55">nothing judgeable</span>');
  const ok = js.filter(e => e.dc <= tolOf(e)).length;
  const f = ok / js.length;
  const col = f === 1 ? EDGE_OK : (f >= 0.5 ? EDGE_MID : EDGE_BAD);
  return row('Alarm co-clear', '<span style="color:'+col+'">'+ok+' of '+js.length+
    '</span> <span style="opacity:.55">judged'+
    (js.length < c.es.length ? ', '+(c.es.length-js.length)+' not' : '')+
    '</span>');
}

function criteriaBlock(c){
  if(!VERIFIED) return '';
  const dim = s => '<span style="opacity:.55">'+s+'</span>';
  let h = '<div style="margin-top:10px;opacity:.6;font-size:11px">how the lines '+
    'are judged</div>';
  if(BY_KIND){
    const kinds = new Map();
    for(const i of c.al){
      const a = G.alarms[i], k = a.n;
      if(alarmSyn(a)) continue;
      if(!kinds.has(k)) kinds.set(k, {n: 0, tol: a.tol, tl: !!a.tl, syn: false});
      kinds.get(k).n++;
    }
    const ks = [...kinds].sort((x, y) => y[1].n - x[1].n);
    h += ks.slice(0, 8).map(([k, v]) => row(esc(G.strings[k]),
      (v.syn ? dim('synthetic: not judged') : v.tol != null
        ? '&#8804;'+durT(v.tol)+(v.tl ? ' '+dim('by lift') : '') : dim('no tolerance'))+' '+
      dim(fmt(v.n)+' alarm'+(v.n === 1 ? '' : 's')))).join('')+
      (ks.length > 8 ? '<div class="hint">+'+(ks.length-8)+' more kinds</div>' : '')+
      '<div class="hint" style="margin:3px 0 6px">a line is judged by the '+
      'larger tolerance of its two alarms</div>';
  }
  const by = new Map();
  let noClear = 0;
  const nj = new Map();
  for(const e of c.es){

    if(alarmSyn(G.alarms[e.i]) || alarmSyn(G.alarms[e.j])) continue;
    if(e.dc == null){ noClear++; continue; }
    if(e.nj){ nj.set(e.nj, (nj.get(e.nj) || 0) + 1); continue; }
    const t = tolOf(e);
    if(!by.has(t)) by.set(t, {ok: 0, bad: 0});
    by.get(t)[e.dc <= t ? 'ok' : 'bad']++;
  }
  h += [...by].sort((x, y) => x[0] - y[0]).map(([t, v]) =>
    row('&#8804;'+durT(t)+' '+dim(fmt(v.ok+v.bad)+' line'+(v.ok+v.bad === 1 ? '' : 's')),
      '<span style="color:'+EDGE_OK+'">'+fmt(v.ok)+' together</span>'+
      (v.bad ? ' <span style="color:'+EDGE_BAD+'">'+fmt(v.bad)+' apart</span>' : ''))).join('');
  const not = noClear + [...nj.values()].reduce((a, b) => a + b, 0);
  if(not)
    h += row('not judged '+dim(fmt(not)+' line'+(not === 1 ? '' : 's')),
      dim([noClear ? fmt(noClear)+' no clear time at one end' : '']
        .concat([...nj].map(([k, v]) => fmt(v)+' '+(NJ_WHY[k] || 'no yardstick')))
        .filter(Boolean).join(' &#183; ')));
  return h;
}

function incidentRow(c){
  if(!M.by_incident) return '';
  const mcs = new Set(c.al.map(i => G.alarms[i].mc).filter(x => x != null));
  return row('the model\'s clusters in it', mcs.size > 1
    ? '<span style="color:#bc8cff">'+mcs.size+'</span> <span style="opacity:.55">joined through a ticket that spans them</span>'
    : '1 <span style="opacity:.55">nothing joined through a ticket</span>');
}

function tkRecallRows(c){
  const r = tkRecall(c);
  if(!r || !r.all) return '';
  const dim = s => '<span style="opacity:.55">'+s+'</span>';
  const out = r.other + r.alone;
  if(!out) return '';

  const why = {late: 0, far: 0, low: 0, avg: 0};
  let known = false;
  for(const x of ticketsOf(c)){
    const k = TK[x.k];
    const w = k.owg && x.als.length ? k.owg[String(Math.min(...x.als))] : null;
    if(!w) continue;
    known = true;
    for(const q in w) why[q] = (why[q] || 0) + w[q];
  }
  const parts = WHY_SHORT.filter(([w]) => why[w]).map(([w, l]) => l+' '+fmt(why[w]));
  return row('outside this cluster', '<span style="color:'+EDGE_BAD+'">'+fmt(out)+'</span> '+
        dim('from '+fmt(r.split)+' ticket'+(r.split === 1 ? '' : 's')))+
      '<div class="hint" style="margin:-2px 0 2px;text-align:right">'+
        [r.other ? fmt(r.other)+' in another cluster' : '',
         r.alone ? fmt(r.alone)+' in no cluster' : ''].filter(Boolean).join(' &#183; ')+'</div>'+
      (known && parts.length
        ? '<div class="hint" style="margin:0 0 6px;text-align:right">why: '+parts.join(' &#183; ')+'</div>'
        : '');
}
function showCluster(){
  const c = clusters[curIdx];

  const catSites = new Map();
  for(const i of c.al){
    const a = G.alarms[i];
    if(!catSites.has(a.c)) catSites.set(a.c, new Set());
    catSites.get(a.c).add(a.s);
  }
  const cats = new Map([...catSites].map(([k, v]) => [k, v.size]));
  $('detail').innerHTML =
    '<h2>Cluster</h2>'+
    rootRowOf(c) +
    row('alarms', fmt(c.al.length)) +
    row('sites', fmt(c.nSites) + (c.sites.length > c.nSites
      ? ' <span style="opacity:.55">+' + (c.sites.length - c.nSites) +
        ' on the path</span>' : '')) +
    row('pairs', fmt(c.es.length)) + coclearRow(c) +

    tkRecallRows(c) +
    rcRowOf(c) + rpRowOf(c) + woRowOf(c) +

    spreadRowOf(c) + blastRowOf(c) +
    [...cats].sort((a,b)=>b[1]-a[1]).slice(0,4).map(p=>
      row('<span class="chip" style="background:'+catColor(p[0])+'">'+
          G.strings[p[0]]+'</span>', fmt(p[1])+
          ' <span style="opacity:.55">site'+(p[1] === 1 ? '' : 's')+'</span>')).join('')+
    criteriaBlock(c)+seqBlock(c);
  wireDetail();
}

function bundleCounts(ks){
  const js = ks.map(k => E[k].ref).filter(judgedE);
  return {n: ks.length, judged: js.length,
          ok: js.filter(m => m.dc <= tolOf(m)).length};
}
function bundleTip(e){
  const ks = bundleShown(e), c = bundleCounts(ks);
  return G.sites[G.alarms[N[e.a].ref].s].n+' '+DASH+' '+
         G.sites[G.alarms[N[e.b].ref].s].n+': '+c.n+' pair'+(c.n === 1 ? '' : 's')+
         (VERIFIED && c.judged ? ', '+c.ok+' of '+c.judged+' co-cleared' : '');
}
function showEdge(k){
  const e = E[k];

  if(e.kind === 'tklink'){ showNode(e.b); return; }
  if(e.kind === 'synjudge' || e.kind === 'synsyn'){

    const sv = synJudgeInfo(e), two = e.kind === 'synsyn';
    const ks = two ? [TK[N[e.a].tk], TK[N[e.b].tk]] : [TK[e.tk]];
    const verdict = !sv
      ? row('cleared apart', '<span style="opacity:.55">not judged: '+
          (two ? (ks[0].sc == null || ks[1].sc == null ? 'no real clear at one end' : 'no yardstick')
               : (G.alarms[N[e.a].ref].ct == null || G.alarms[N[e.b].ref].ct == null
                  ? 'no real clear at one end' : 'neither kind has a tolerance'))+'</span>')
      : row('cleared apart', '<span style="color:'+(sv.ok ? '#4ade80' : '#f87171')+'">'+dur(sv.dc)+
          (sv.ok ? ' together' : ' apart')+'</span>')+
        row('judged by', '&#8804;'+durT(sv.tol)+' <span style="opacity:.55">'+
          (sv.flat ? 'the page\'s flat tolerance: neither synthetic kind has one'
                   : 'the larger tolerance of the kinds that have one')+'; not counted in any score</span>');
    $('detail').innerHTML = backLink() +
      '<h2>'+(two ? 'Two synthetic alarms' : 'Alarm and its synthetic alarm')+'</h2>'+
      '<div style="margin-top:8px">'+
      ks.map(k => row('ticket', '<span style="color:var(--find)">'+esc(k.id)+'</span> '+
        '<span style="color:'+SYNC+'">'+esc(k.syn || '')+'</span>')+
        (two ? row('its synthetic alarm cleared', k.sc != null ? iso(k.sc)+' '+TZL : DASH) : '')).join('')+
      verdict+'</div>'+
      (two ? '' : alarmLine(N[e.a].ref)+alarmLine(N[e.b].ref));
    wireDetail();
    return;
  }
  if(e.kind === 'synlink'){ showNode(SYN_LOW ? e.b : e.a); return; }
  if(e.kind === 'rcup' || e.kind === 'wolink'){ showNode(e.b); return; }

  if(e.kind === 'nepost' || e.kind === 'necell'){ showNode(e.b); return; }
  if(e.kind === 'anc' || e.kind === 'nelink' || e.kind === 'nex2' || e.dev){ showNode(e.a); return; }
  if(e.kind === 'bundle'){
    const ks = bundleShown(e), c = bundleCounts(ks), ms = ks.map(j => E[j].ref);
    const sa = G.alarms[N[e.a].ref].s, sb = G.alarms[N[e.b].ref].s;
    const top = ms.slice().sort((x, y) => (y.s ?? -1e9) - (x.s ?? -1e9));
    const col = bundleColor(ks);
    $('detail').innerHTML = backLink() +
      '<h2>Site pair</h2>'+
      '<div style="font-size:14px;color:#fff">'+esc(G.sites[sa].n)+' '+DASH+' '+
        esc(G.sites[sb].n)+'</div>'+
      '<div style="margin-top:8px">'+
      row('alarm pairs', fmt(c.n))+
      (VERIFIED ? row('co-clear', c.judged
        ? '<span style="color:'+col+'">'+c.ok+' of '+c.judged+'</span>'+
          ' <span style="opacity:.55">judged</span>'
        : '<span style="opacity:.55">nothing judgeable</span>') : '')+
      row('best score', top[0].s == null ? DASH : top[0].s.toFixed(2))+
      row('fired apart', dur(Math.min(...ms.map(m => m.g)))+
          (ms.length > 1 ? ' '+DASH+' '+dur(Math.max(...ms.map(m => m.g))) : ''))+
      row('topology', hopLabel(ms[0].h))+
      row('distance', ms[0].d == null ? 'no coords' : ms[0].d.toFixed(1)+' km')+
      '</div>'+
      '<div style="margin-top:10px;opacity:.6;font-size:11px">strongest pairs</div>'+
      top.slice(0, 5).map(m => alarmLine(m.i)+alarmLine(m.j)+
        '<hr style="margin:6px 0;opacity:.3">').join('');
    wireDetail();
    return;
  }
  if(e.kind === 'held'){
    $('detail').innerHTML = backLink() + '<h2>Held by its ticket</h2>' +
      '<div class="hint" style="margin:4px 0 8px">not a model pair: the model linked this alarm to nothing, '+
      'and its ticket holds it here (no score, not judged)</div>' + alarmLine(N[e.b].ref) + alarmLine(N[e.a].ref);
    wireDetail();
    return;
  }
  if(e.kind !== 'corr'){
    const a=N[e.a], b=N[e.b];
    $('detail').innerHTML = backLink() + (e.kind==='topo'
      ? '<h2>Topology</h2><div style="font-size:14px;color:#fff">'+
        G.sites[a.ref].n+' '+DASH+' '+G.sites[b.ref].n+'</div>'
      : '<h2>Alarm to its site</h2>');
    wireDetail();
    return;
  }
  const m = e.ref, A = G.alarms[m.i], B = G.alarms[m.j];
  const hopName = hopLabel(m.h);
  $('detail').innerHTML = backLink() +
    '<h2>Pair</h2>'+
    '<div style="font-size:14px;color:#fff">'+G.sites[A.s].n+' '+ARR+' '+
      G.sites[B.s].n+'</div>'+
    '<div style="margin-top:8px">'+
    row('score', m.s == null
      ? '<span style="opacity:.55">not a model pair</span>' : m.s.toFixed(2))+
    row('fired apart', dur(m.g))+
    clearGapRow(m)+
    row('topology', hopName)+
    row('distance', m.d==null?'no coords':m.d.toFixed(1)+' km')+
    '</div>'+alarmLine(m.i)+alarmLine(m.j);
  wireDetail();
}

function rcRows(k){
  if(!k.rc) return HAS_RC ? row('resolution', '<span style="opacity:.55">not in the incident files</span>') : '';
  return k.rc.map((v, j) => row('resolution tier '+(j+1), v ? esc(v) : DASH)).join('')+
    (k.rj ? '' : '<div class="hint" style="margin:-2px 0 6px">names no cause: no root-cause line</div>');
}

function rpRows(k){
  if(!HAS_RP) return '';
  if(!k.rp) return row('predicted', '<span style="opacity:.55">not judged (not trainable: blank / CC / cancelled)</span>');
  const tier = (v, ok) => '<span style="color:'+(ok ? RP_OK : RP_BAD)+'">'+(v ? esc(v) : DASH)+'</span>';
  return '<div class="hint" style="margin:8px 0 4px">predicted at Reported_time, test day '+esc(RP.day)+
      ' &#183; <span style="color:'+RP_OK+'">right</span> / <span style="color:'+RP_BAD+'">wrong</span> per tier</div>'+
    (k.rt ? row('truth as a class', k.rt.map(v => esc(v)).join(RP_SEP)) : '')+
    k.rp.map(([m, p, ok]) => {
      const s = RP_MODELS.find(x => x.model === m);
      return row(esc(s ? s.name : m), p.map((v, j) => tier(v, ok[j])).join(RP_SEP));
    }).join('');
}

function rpRowOf(c){
  if(!HAS_RP) return '';
  const ks = [...new Set(ticketsOf(c).map(x => x.k))].map(k => TK[k]).filter(k => k.rp);
  if(!ks.length) return row('predicted', '<span style="opacity:.55">no ticket here is judged</span>');
  const col = (x, n) => x === n ? RP_OK : x * 2 > n ? '#fbbf24' : RP_BAD;
  return '<div class="hint" style="margin:8px 0 4px">resolution predicted right: tier 1 / tier 2 / path</div>'+
    RP_MODELS.map(s => {
      const vs = ks.map(k => k.rp.find(r => r[0] === s.model)).filter(Boolean), n = vs.length;
      if(!n) return '';
      const t1 = vs.filter(r => r[2][0]).length, t2 = vs.filter(r => r[2][1]).length,
            pa = vs.filter(r => r[2].every(Boolean)).length;
      return row(esc(s.name), [t1, t2, pa].map(x => '<span style="color:'+col(x, n)+'">'+x+'</span>').join(' / ')+
        ' <span style="opacity:.55">of '+n+' ticket'+(n === 1 ? '' : 's')+'</span>');
    }).join('');
}

function rcRowOf(c){
  if(!HAS_RC) return '';
  const ks = [...new Set(ticketsOf(c).map(x => x.k))].map(k => TK[k]).filter(k => k.rj);
  if(ks.length < 2) return row('same root cause', '<span style="opacity:.55">fewer than 2 tickets name a cause</span>');
  const cnt = new Map();
  for(const k of ks) cnt.set(k.rj, (cnt.get(k.rj) || 0) + 1);
  const [top, m] = [...cnt].sort((x, y) => y[1] - x[1])[0];
  return row('same root cause', '<span title="'+esc(top)+'" style="color:'+
    (m === ks.length ? '#4ade80' : m * 2 > ks.length ? '#fbbf24' : '#f87171')+'">'+
    m+' of '+ks.length+' tickets</span>');
}

function woRowOf(c){
  if(!HAS_WO) return '';
  const ks = [...new Set(ticketsOf(c).map(x => x.k))].map(k => TK[k]);
  const ws = ks.flatMap(k => k.wo || []), live = ws.filter(w => !woCanceled(w));
  const withWo = ks.filter(k => (k.wo || []).length).length;
  if(!ws.length) return row('work orders', '<span style="opacity:.55">none of its '+ks.length+' tickets opened one</span>');
  const st = new Map();
  for(const w of ws) st.set(w.st || '?', (st.get(w.st || '?') || 0) + 1);
  const rcs = new Set(live.map(w => w.rc).filter(Boolean));
  return row('work orders', '<span style="color:'+WOC+'" title="'+esc([...st].map(([s, n]) => s+' '+n).join(', '))+'">'+
      live.length+'</span> <span style="opacity:.55">opened'+(ws.length > live.length ? ' (+'+(ws.length - live.length)+' cancelled)' : '')+
      ' by '+withWo+' of '+ks.length+' tickets</span>')+
    (rcs.size ? row('WO root causes', rcs.size === 1 ? esc([...rcs][0])
      : '<span style="color:#fbbf24">'+rcs.size+' different</span>') : '');
}

function woRows(k){
  if(!HAS_WO) return '';
  const ws = k.wo || [];
  if(!ws.length) return row('work orders', '<span style="opacity:.55">none in the work-order exports</span>');
  return ws.map(w => row('work order', '<span style="color:'+(woCanceled(w) ? WO_NONE : WOC)+'">'+esc(w.id)+'</span> '+
    '<span style="opacity:.6">'+esc(w.st || '')+' '+DEG+' '+iso(w.t).slice(5, 16)+'</span>')).join('');
}
function showNode(i){
  const n = N[i];
  if(n.type==='site'){
    const s = G.sites[n.ref];
    const mine = clusters[curIdx].al.filter(a => G.alarms[a].s===n.ref);
    const roles = (s.r && s.r.length)
      ? s.r.map(x => G.strings[x[0]]).join(', ') : null;
    $('detail').innerHTML = backLink() +
      '<h2>Site</h2><div style="font-size:14px;color:#fff">'+s.n+'</div>'+

                                  N.some(n => n.type === 'wo') ? WO_Z : 0) : 1) + LIFT;
    const H = Math.max(LAYER_MIN, Math.min(LAYER_MAX, layoutBox().span*LAYER_FRACTION));
    const down = (top - 1) * H * Math.cos(elev) / 2 / Math.sin(elev);

    if(!raf) draw();

let playT = null, playOn = false, playRaf = null, playLast = 0, playAcc = 0;
let playT0 = 0, playSpan = 0, moments = [], siteFirst = new Map();
let playNowT = null, seqK = null;
const MOMENT_MS = 900;
const ICON_PLAY  = '<svg viewBox="0 0 12 12"><path d="M3 1.5l7.5 4.5L3 10.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 12 12"><path d="M2.5 2h2.4v8H2.5zM7.1 2h2.4v8H7.1z"/></svg>';

const alarmShown = i => playT == null || G.alarms[i].t - playT0 <= playT;

const PH_SYN = () => SYN_LOW ? .25 : .5, PH_TK = () => SYN_LOW ? .5 : .25;
const PH_RC = .75;

const woAt = (k, j) => Math.max(TK[k].wo[j].t, TK[k].t + .9);

const shownAt = n => n.type === 'alarm' ? G.alarms[n.ref].t
  : n.type === 'ticket' ? TK[n.ref].t + PH_TK()
  : n.type === 'syn' ? (n.tk != null ? TK[n.tk].t : Math.min(...n.cent.map(m => TK[N[m].ref].t))) + PH_SYN()
  : n.type === 'rc' ? Math.min(...n.cent.map(m => TK[N[m].ref].t)) + PH_RC
  : n.type === 'wo' ? woAt(n.tk, n.w)
  : null;
const nodeShown  = n => playT == null || n.type === 'site' || n.type === 'ne' ||
                        shownAt(n) - playT0 <= playT;
const ticketShown = k => playT == null || TK[k].t + PH_TK() - playT0 <= playT;
const edgeShown  = e => nodeShown(N[e.a]) && nodeShown(N[e.b]);

const siteQuiet  = s => playT != null && siteFirst.has(s) &&
                        siteFirst.get(s) > playT;

function momentAt(t){
  let lo = 0, hi = moments.length - 1, k = -1;
  while(lo <= hi){
    const m = (lo + hi) >> 1;
    if(moments[m] <= t){ k = m; lo = m + 1; } else hi = m - 1;
  }
  return k;
}

function playerSetup(){
  playOn = false;
  if(playRaf) cancelAnimationFrame(playRaf);
  playRaf = null; playT = null; playNowT = null; seqK = null; nowK = null;
  const c = clusters[curIdx], A = G.alarms;

  const tkx = ticketsOf(c);
  const ts = [...new Set(c.al.map(i => A[i].t)
                .concat(tkx.map(x => TK[x.k].t + PH_TK()))
                .concat(tkx.filter(x => TK[x.k].syn).map(x => TK[x.k].t + PH_SYN()))
                .concat(HAS_RC ? tkx.filter(x => rcKey(TK[x.k])).map(x => TK[x.k].t + PH_RC) : [])
                .concat(HAS_WO ? tkx.flatMap(x => (TK[x.k].wo || []).map((_, j) => woAt(x.k, j))) : []))]
             .sort((x, y) => x - y);
  playT0 = ts[0];

  moments = [-1].concat(ts.map(t => t - playT0));
  playSpan = moments[moments.length - 1];
  siteFirst = new Map();
  for(const i of c.al){
    const s = A[i].s, t = A[i].t - playT0;
    if(!siteFirst.has(s) || t < siteFirst.get(s)) siteFirst.set(s, t);
  }
  const bar = $('plBar');
  bar.min = -1;
  bar.max = Math.max(1, playSpan);
  bar.disabled = moments.length < 2;
  $('player').hidden = false;
  playerUI();
}

const NOW_ROWS = 12;
let nowK = null;
function renderNow(){
  const card = $('nowCard');
  if(playT == null || curIdx < 0 || !clusters[curIdx]){
    card.hidden = true; nowK = null; return;
  }
  if(playT < 0){ card.hidden = true; nowK = null; return; }
  const k = Math.max(0, momentAt(playT));
  if(k === nowK && !card.hidden) return;
  nowK = k;

  const A = G.alarms, tm = playT0 + moments[k], t = Math.floor(tm), ph = tm - t + 1e-9;
  const al = clusters[curIdx].al.filter(i => A[i].t === t);
  const atT = ticketsOf(clusters[curIdx]).filter(x => TK[x.k].t === t);
  const tks = ph >= PH_TK() ? atT : [];
  const syns = ph >= PH_SYN() ? atT.filter(x => TK[x.k].syn) : [];
  const fresh = new Set(al.map(i => A[i].s)
                          .filter(s => siteFirst.get(s) === t - playT0));
  const groups = new Map();
  for(const i of al){
    if(!groups.has(A[i].c)) groups.set(A[i].c, []);
    groups.get(A[i].c).push(i);
  }
  let h = '<div class="nc-h" title="click to fold &#183; drag to move"><b>T+'+
    (t === playT0 ? '0s' : dur(t - playT0))+
    '</b><span>'+iso(t).slice(11)+' '+TZL+'</span><span>'+DEG+' '+
    (al.length || !tks.length ? al.length+' alarm'+(al.length === 1 ? '' : 's') : '')+
    (tks.length ? (al.length ? ' '+DEG+' ' : '')+tks.length+' ticket'+
      (tks.length === 1 ? '' : 's') : '')+
    (fresh.size ? ' '+DEG+' '+fresh.size+' new site'+
      (fresh.size === 1 ? '' : 's') : '')+'</span>'+
    '<span class="nc-fold">'+(nowFold ? '&#9656;' : '&#9662;')+'</span></div>';

  let rows = 0;
  for(const [cat, is] of [...groups].sort((x, y) => y[1].length - x[1].length)){
    if(rows >= NOW_ROWS) break;
    h += '<div class="nc-g"><span class="chip" style="background:'+
      catColor(cat)+'">'+esc(G.strings[cat])+'</span>'+
      (is.length > 1 ? ' <span class="nc-v">'+is.length+'</span>' : '');
    for(const i of is){
      if(rows >= NOW_ROWS) break;
      const a = A[i], full = G.strings[a.n], sn = shortName(full);
      h += '<div class="nc-r" title="'+esc(full)+'">'+
        '<span class="nc-s">'+esc(G.sites[a.s].n)+'</span>'+
        '<span class="nc-n">'+esc(sn.name)+
          (a.o > 1 ? ' '+DEG+' '+a.o+'x' : '')+'</span>'+
        (sn.vendor ? '<span class="nc-v">'+esc(sn.vendor)+'</span>' : '')+
        (fresh.has(a.s) ? '<span class="nc-new">new site</span>' : '')+
        '</div>';
      rows++;
    }
    h += '</div>';
  }

  if(syns.length){
    h += '<div class="nc-g"><span class="chip" style="background:'+SYNC+'">SYNTHETIC</span>'+
      (syns.length > 1 ? ' <span class="nc-v">'+syns.length+'</span>' : '');
    for(const x of syns.slice(0, NOW_ROWS)){
      const k = TK[x.k];
      h += '<div class="nc-r" title="'+esc(k.syn)+'">'+
        '<span class="nc-s">'+esc(G.sites[k.s].n)+'</span>'+
        '<span class="nc-n" style="color:'+SYNC+'">'+esc(k.syn)+'</span></div>';
    }
    h += '</div>';
  }
  if(tks.length){
    h += '<div class="nc-g"><span class="chip" style="background:'+TKC+'">TICKET</span>'+
      (tks.length > 1 ? ' <span class="nc-v">'+tks.length+'</span>' : '');
    for(const x of tks.slice(0, NOW_ROWS)){
      const k = TK[x.k];
      h += '<div class="nc-r" title="'+esc(k.syn || '')+'">'+
        '<span class="nc-s">'+esc(G.sites[k.s].n)+'</span>'+
        '<span class="nc-n" style="color:var(--find)">'+esc(k.id)+'</span>'+
        '<span class="nc-v">'+sgn(x.d)+' from its alarm</span></div>';
    }
    h += '</div>';
  }
  if(al.length > rows)
    h += '<div class="nc-h nc-more" style="margin-top:6px">+'+
      (al.length - rows)+' more '+DEG+' see Sequence</div>';
  card.innerHTML = h;
  card.classList.toggle('fold', nowFold);
  card.hidden = false;
  placeNow();
}

let nowFold = prefGet('nowFold') === '1';
let nowPos = null;
try{ nowPos = JSON.parse(prefGet('nowPos') || 'null'); }catch(e){ nowPos = null; }
function placeNow(){
  const card = $('nowCard'), st = $('stage');
  if(!nowPos || card.hidden) return;

  const x = Math.max(0, Math.min(st.clientWidth  - card.offsetWidth,  nowPos.x));
  const y = Math.max(0, Math.min(st.clientHeight - card.offsetHeight, nowPos.y));
  card.style.left = x+'px'; card.style.top = y+'px';
}
$('nowCard').addEventListener('mousedown', e => {
  const head = e.target.closest('.nc-h');
  if(!head || head !== $('nowCard').firstElementChild) return;
  e.preventDefault();
  const card = $('nowCard');
  const x0 = e.clientX, y0 = e.clientY;
  const l0 = card.offsetLeft, t0 = card.offsetTop;
  let moved = false;
  const move = ev => {
    if(!moved && Math.hypot(ev.clientX - x0, ev.clientY - y0) < 4) return;
    moved = true;
    nowPos = {x: l0 + ev.clientX - x0, y: t0 + ev.clientY - y0};
    placeNow();
  };
  const up = () => {
    removeEventListener('mousemove', move);
    removeEventListener('mouseup', up);
    if(moved){ prefSet('nowPos', JSON.stringify(nowPos)); return; }
    nowFold = !nowFold;
    prefSet('nowFold', nowFold ? '1' : '0');
    card.classList.toggle('fold', nowFold);
    const f = card.querySelector('.nc-fold');
    if(f) f.innerHTML = nowFold ? '&#9656;' : '&#9662;';
  };
  addEventListener('mousemove', move);
  addEventListener('mouseup', up);
});

function playerUI(){

  renderNow();

  }

  }

}

function syncSeq(scroll){
  const d = $('detail');

  d.classList.toggle('replaying', playT != null);
  const k = playT == null ? null : momentAt(playT);
  if(k === seqK) return;
  seqK = k;
  for(const el of d.querySelectorAll('.tl-e'))
    el.classList.toggle('future', el.dataset.k != null
      ? !ticketShown(+el.dataset.k) : !alarmShown(+el.dataset.a));
  let now = null;
  const nowS = playNowT == null ? null : Math.floor(playNowT);
  for(const el of d.querySelectorAll('.tl-b, .tl-gap')){
    const t = +el.dataset.t, gap = el.classList.contains('tl-gap');
    const on = !gap && nowS != null && t === nowS;
    el.classList.toggle('past', nowS != null && t < nowS);
    el.classList.toggle('fut',  nowS != null && t > nowS);
    if(gap) continue;
    el.classList.toggle('now', on);
    if(on) now = el;
  }

  if(!now && playNowT != null && playT >= 0 && !tlAll && $('tlmore')){
    tlAll = true; showCluster();
    return;
  }
  if(scroll && now) now.scrollIntoView({block:'nearest'});
}

function playSet(t, scroll){
  playT = t;
  playNowT = t == null ? null : playT0 + moments[Math.max(0, momentAt(t))];
  playerUI();
  syncSeq(scroll);
  if(!raf) draw();
}

function playFrame(now){
  const dt = now - playLast;
  playLast = now;
  const sp = $('plSpeed').value;
  let t = playT, end = false;
  if(sp === 'm'){
    playAcc += dt;
    if(playAcc >= MOMENT_MS){
      playAcc = 0;
      const k = momentAt(t);
      if(k + 1 < moments.length) t = moments[k + 1];
      else end = true;
    }
  } else {
    t = Math.min(playSpan, t + dt/1000 * (+sp));
    end = t >= playSpan;
  }
  if(t !== playT) playSet(t, true);
  else if(!raf) draw();
  if(end){ playStop(); return; }
  playRaf = requestAnimationFrame(playFrame);
}

function playStart(){
  if(curIdx < 0) return;

  if(playT == null || playT >= playSpan) playSet(moments[0], true);
  playOn = true; playLast = performance.now(); playAcc = 0;
  playerUI();
  playRaf = requestAnimationFrame(playFrame);
}

function playStop(ui = true){
  playOn = false;
  if(playRaf) cancelAnimationFrame(playRaf);
  playRaf = null;
  if(ui){ playerUI(); if(!raf) draw(); }
}

function playStep(d){
  playStop();
  let k = playT == null ? (d > 0 ? -1 : moments.length) : momentAt(playT);
  k = Math.max(0, Math.min(moments.length - 1, k + d));
  playSet(moments[k], true);
}

$('plPlay').onclick  = () => playOn ? playStop() : playStart();
$('plPrev').onclick  = () => playStep(-1);
$('plNext').onclick  = () => playStep(+1);
$('plReset').onclick = () => { playStop(); playSet(moments[0], true); };
$('plAll').onclick   = () => { playStop(); playSet(null, false); };
$('plBar').addEventListener('input', () => {
  playStop(false);
  playSet(+$('plBar').value, false);
});

addEventListener('keydown', e => {
  if(curIdx < 0 || $('player').hidden) return;
  const tag = e.target.tagName;
  if(tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if(e.key === ' ' && tag === 'BUTTON') return;
  if(e.key === ' ')               playOn ? playStop() : playStart();
  else if(e.key === 'ArrowRight') playStep(+1);
  else if(e.key === 'ArrowLeft')  playStep(-1);
  else if(e.key === 'Home'){ playStop(); playSet(0, true); }
  else if(e.key === 'End'){  playStop(); playSet(null, false); }
  else return;
  e.preventDefault();
});

const MAP_BASES = {
  osm:       {...OSM, blank: '#f2efe9', light: true},
  osmdark:   {...OSM, blank: '#0d1016', invert: true},
  streets:   {...esri('World_Street_Map'),            max: 18, blank: '#f2efe9', light: true},
  satellite: {...esri('World_Imagery'),               max: 18, blank: '#1b1f24'},
  dark:      {...esri('Canvas/World_Dark_Gray_Base'), max: 16, blank: '#262626'},
};
const FROM_FILE = location.protocol === 'file:';
let mapOn = false;
let mapBase = MAP_BASES[prefGet('mapBase')] ? prefGet('mapBase')
                                            : (FROM_FILE ? 'streets' : 'osm');
let geo = null;
const tiles = new Map();
let tileOk = 0, tileBad = 0, tileRedraw = false;

function mapNote(html){
  const n = $('mapNote');
  n.hidden = !html;
  n.innerHTML = html || '';
}

function merc(lat, lon){
  const s = Math.sin(Math.max(-85.05, Math.min(85.05, lat)) * Math.PI/180);
  return {x: (lon + 180) / 360 * 256,
          y: (0.5 - Math.log((1 + s) / (1 - s)) / (4*Math.PI)) * 256};
}

function geoSites(sites){
  const have = [], lost = [];
  for(const s of sites){
    const g = G.sites[s];
    (g.lat != null && g.lon != null && isFinite(g.lat) && isFinite(g.lon)
      ? have : lost).push(s);
  }
  if(!have.length){
    geo = null;
    mapNote('no site in this cluster has coordinates ' + DEG +
            ' drawn as the graph instead');
    return null;
  }
  const m = have.map(s => merc(G.sites[s].lat, G.sites[s].lon));
  const xs = m.map(p => p.x), ys = m.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const want = Math.max(280, Math.min(1100, 140*Math.sqrt(sites.length)));

  const z = Math.max(4, Math.min(17, Math.log2(want / Math.max(x1-x0, y1-y0, 1e-9))));
  const k = 2 ** z;
  geo = {z, ox: (x0 + x1)/2*k, oy: (y0 + y1)/2*k, lost: lost.length};

  const pos = new Map(), placed = [];
  have.forEach((s, i) => {
    const bx = m[i].x*k - geo.ox, by = m[i].y*k - geo.oy;
    let x = bx, y = by;
    for(let t = 1; t < 40 && placed.some(p => Math.hypot(p.x-x, p.y-y) < 12); t++){
      const r = 14*(1 + t/8), ang = t*2.4;
      x = bx + Math.cos(ang)*r; y = by + Math.sin(ang)*r;
    }
    placed.push({x, y});
    pos.set(s, {x, y});
  });

  const east = (x1 - x0)/2*k + 90;
  lost.forEach((s, i) => pos.set(s, {x: east, y: (i - (lost.length-1)/2)*60}));
  mapNote(lost.length ? lost.length + ' site' + (lost.length === 1 ? '' : 's') +
          ' with no coordinates ' + DEG + ' standing in a column east of the map'
          : '');
  return pos;
}

function redrawSoon(){
  if(tileRedraw) return;
  tileRedraw = true;
  requestAnimationFrame(() => { tileRedraw = false; if(!raf) draw(); });
}
function tileAt(base, z, x, y){
  const key = base + '/' + z + '/' + x + '/' + y;
  let t = tiles.get(key);
  if(t) return t;
  if(tiles.size > 900) tiles.delete(tiles.keys().next().value);
  t = {img: new Image(), ok: false, bad: false};
  t.img.referrerPolicy = 'strict-origin-when-cross-origin';
  t.img.onload  = () => { t.ok = true;  tileOk++;  redrawSoon(); };
  t.img.onerror = () => { t.bad = true; tileBad++; redrawSoon(); };
  t.img.src = MAP_BASES[base].tile(z, x, y);
  tiles.set(key, t);
  return t;
}

const LEAFLET = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/';
let leafState = 'off';
let leafMap = null, leafLayer = null, leafBase = null, leafCov = null;

function loadLeaflet(){
  if(leafState !== 'off') return;
  leafState = 'loading';
  const css = document.createElement('link');
  css.rel = 'stylesheet'; css.href = LEAFLET + 'leaflet.css';
  document.head.appendChild(css);
  const s = document.createElement('script');
  s.src = LEAFLET + 'leaflet.js';
  const fail = () => {
    leafState = 'failed';
    mapNote('Leaflet could not load ' + DEG + ' drawing the map tiles directly');
    if(!raf) draw();
  };
  s.onload = () => { if(window.L){ leafState = 'ready'; if(!raf) draw(); } else fail(); };
  s.onerror = fail;
  document.head.appendChild(s);
}
const leafOn = () => mapOn && !!geo && leafState === 'ready';

function unmerc(px, py, z){
  const n = 256 * 2 ** z;
  return [Math.atan(Math.sinh(Math.PI * (1 - 2*py/n))) * 180/Math.PI,
          px / n * 360 - 180];
}

function syncLeaf(a, b, c, d, e, f, wx0, wx1, wy0, wy1){
  const B = MAP_BASES[mapBase], el = $('leaf');
  el.hidden = false;
  if(!leafMap)
    leafMap = L.map(el, {zoomControl: false, attributionControl: false,
      dragging: false, touchZoom: false, scrollWheelZoom: false,
      doubleClickZoom: false, boxZoom: false, keyboard: false,
      zoomSnap: 0, fadeAnimation: false, zoomAnimation: false,
      markerZoomAnimation: false, inertia: false});
  if(leafBase !== mapBase){
    if(leafLayer) leafMap.removeLayer(leafLayer);

    leafLayer = L.tileLayer(B.leaf, {maxZoom: 22, maxNativeZoom: B.max,
                                     keepBuffer: 4, updateWhenIdle: false,
                                     referrerPolicy: 'strict-origin-when-cross-origin'});
    leafLayer.on('tileload', () => { tileOk++; });
    leafLayer.on('tileerror', () => { tileBad++; leafNote(); });
    leafLayer.addTo(leafMap);
    leafBase = mapBase;
    el.style.background = B.blank;
    el.classList.toggle('inv', !!B.invert);
  }

  let zl = Math.max(2, Math.min(21, geo.z + Math.log2(cam.k)));
  const cv0 = leafCov;
  const fits = cv0 && cv0.geo === geo && Math.abs(cv0.zl - zl) < 0.6 &&
               wx0 >= cv0.x0 && wx1 <= cv0.x1 && wy0 >= cv0.y0 && wy1 <= cv0.y1;
  if(!fits){
    const mx = (wx1 - wx0)*0.35, my = (wy1 - wy0)*0.35;
    const x0 = wx0 - mx, x1 = wx1 + mx, y0 = wy0 - my, y1 = wy1 + my;
    let s = 2 ** (zl - geo.z);

    while((x1 - x0)*s*(y1 - y0)*s > 9e6 && zl > 2){ zl -= 0.5; s = 2 ** (zl - geo.z); }
    const w = Math.max(1, Math.round((x1 - x0)*s)), h = Math.max(1, Math.round((y1 - y0)*s));
    el.style.width = w + 'px'; el.style.height = h + 'px';
    const cx = (x0 + x1)/2, cy = (y0 + y1)/2;
    leafMap.invalidateSize({pan: false, animate: false});
    leafMap.setView(unmerc(cx + geo.ox, cy + geo.oy, geo.z), zl, {animate: false});
    leafCov = {geo, zl, s, w, h, cx, cy, x0, x1, y0, y1};
  }

  const C = leafCov, s = C.s;
  const gx = C.cx - C.w/2/s, gy = C.cy - C.h/2/s;
  el.style.transform = 'matrix(' + [a/s, b/s, c/s, d/s,
    a*gx + c*gy + e, b*gx + d*gy + f].map(v => +v.toFixed(6)).join(',') + ')';
}

function leafNote(){
  if(tileBad >= 4 && !tileOk)
    mapNote(MAP_BASES[mapBase].osm && FROM_FILE
      ? 'OpenStreetMap does not serve a page opened from a file ' + DEG +
        ' open it through the API, or pick another map'
      : 'the map tiles could not load ' + DEG + ' no internet? The sites are ' +
        'still at their real positions');
}

function hideLeaf(){
  const el = $('leaf');
  if(!el.hidden) el.hidden = true;
}

function drawGround(box){
  if(!geo){ hideLeaf(); drawPlates(box); return; }
  if(leafState === 'off') loadLeaflet();
  const W = cv.clientWidth, H = cv.clientHeight, dpr = devicePixelRatio || 1;
  const cw = view3d ? Math.cos(yaw) : 1, sw = view3d ? Math.sin(yaw) : 0;
  const se = view3d ? Math.sin(elev) : 1, k = cam.k;
  const a = k*cw, b = k*se*sw, c = -k*sw, d = k*se*cw;
  const e = W/2 - (a*cam.x + c*cam.y), f = H/2 - (b*cam.x + d*cam.y);
  const B = MAP_BASES[mapBase];

  const corners = [[0,0],[W,0],[0,H],[W,H]].map(([x, y]) => worldOf(x, y, 0));
  const wx0 = Math.min(...corners.map(p => p.x));
  const wx1 = Math.max(...corners.map(p => p.x));
  const wy0 = Math.min(...corners.map(p => p.y));
  const wy1 = Math.max(...corners.map(p => p.y));
  if(wx0 >= wx1 || wy0 >= wy1) return;
  if(leafOn()){ syncLeaf(a, b, c, d, e, f, wx0, wx1, wy0, wy1); return; }
  hideLeaf();

  let tz = Math.max(2, Math.min(B.max, Math.round(geo.z + Math.log2(k))));
  let span, tx0, tx1, ty0, ty1;
  for(;;){
    span = 256 * 2 ** (geo.z - tz);
    const lim = 2 ** tz - 1;
    tx0 = Math.max(0, Math.floor((wx0 + geo.ox)/span));
    tx1 = Math.min(lim, Math.floor((wx1 + geo.ox)/span));
    ty0 = Math.max(0, Math.floor((wy0 + geo.oy)/span));
    ty1 = Math.min(lim, Math.floor((wy1 + geo.oy)/span));
    if((tx1-tx0+1)*(ty1-ty0+1) <= 220 || tz <= 2) break;
    tz--;
  }
  ctx.save();
  ctx.setTransform(a*dpr, b*dpr, c*dpr, d*dpr, e*dpr, f*dpr);
  ctx.globalAlpha = 1;
  ctx.fillStyle = B.blank;
  ctx.fillRect(tx0*span - geo.ox, ty0*span - geo.oy,
               (tx1-tx0+1)*span, (ty1-ty0+1)*span);
  const seam = span/256*0.6;
  if(B.invert) ctx.filter = INVERT;
  for(let tx = tx0; tx <= tx1; tx++) for(let ty = ty0; ty <= ty1; ty++){
    const t = tileAt(mapBase, tz, tx, ty);
    if(t.ok) ctx.drawImage(t.img, tx*span - geo.ox, ty*span - geo.oy,
                           span + seam, span + seam);
  }
  ctx.restore();
  if(tileBad >= 4 && !tileOk)
    mapNote('the map tiles could not load ' + DEG + ' no internet? The sites ' +
            'are still at their real positions');

}

function setMap(on){
  mapOn = on;
  $('mapBtn').classList.toggle('on', on);
  $('mapBtn').textContent = on ? 'graph' : 'map';
  $('mapBase').hidden = !on;
  $('mapAttr').hidden = !on;
  $('mapAttr').innerHTML = MAP_BASES[mapBase].attr;
  if(!on){ geo = null; mapNote(''); hideLeaf(); }
  if(curIdx >= 0){ cam = {x: 0, y: 0, k: 1}; initSim(); }
}
$('mapBase').value = mapBase;
$('mapBase').addEventListener('change', () => {
  mapBase = $('mapBase').value;
  prefSet('mapBase', mapBase);
  tileOk = 0; tileBad = 0;
  mapNote('');
  $('mapAttr').innerHTML = MAP_BASES[mapBase].attr;
  if(!raf) draw();
});
$('mapBtn').onclick = () => setMap(!mapOn);

cv.addEventListener('mousedown', e => {
  if(curIdx<0) return;
  const r = cv.getBoundingClientRect();

  if(view3d && e.button === 2){
    drag = {rot:true, x:e.clientX, y:e.clientY, yaw0:yaw, el0:elev, moved:false};
    cv.classList.add('drag');
    return;
  }
  const hit = pick(e.clientX-r.left, e.clientY-r.top);
  drag = hit && hit.kind==='node'
    ? {node:hit.i, moved:false, panning:false}
    : {x:e.clientX, y:e.clientY, cx:cam.x, cy:cam.y, moved:false, panning:true};
  cv.classList.add('drag');
});
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('mouseup', e => {
  if(drag && !drag.moved && !drag.rot){
    const r = cv.getBoundingClientRect();
    sel = pick(e.clientX-r.left, e.clientY-r.top);
    if(!sel) showCluster();
    else if(sel.kind==='node') showNode(sel.i);
    else showEdge(sel.i);
    draw();
  }
  drag = null; cv.classList.remove('drag');
});
cv.addEventListener('mousemove', e => {
  if(curIdx<0) return;
  const r = cv.getBoundingClientRect();
  const mx = e.clientX-r.left, my = e.clientY-r.top;
  if(drag){
    if(!drag.panning || Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>3)
      drag.moved = true;
    if(drag.rot){

      yaw  = drag.yaw0 - (e.clientX-drag.x)*0.0065;
      elev = Math.max(0.16, Math.min(1.5,
                      drag.el0 + (e.clientY-drag.y)*0.005));
    } else if(drag.panning){

      const cw = view3d ? Math.cos(yaw) : 1, sw = view3d ? Math.sin(yaw) : 0;
      const sdx = (e.clientX-drag.x)/cam.k;
      const sdy = (e.clientY-drag.y)/cam.k / (view3d ? Math.sin(elev) : 1);
      cam.x = drag.cx-( sdx*cw + sdy*sw);
      cam.y = drag.cy-(-sdx*sw + sdy*cw);
    } else {

      const n = N[drag.node];
      const w = worldOf(mx, my, zOf(n));
      let t = n, dx = 0, dy = 0;
      while(t.anchor != null){
        if(t.off){ dx += t.off.x; dy += t.off.y; }
        t = N[t.anchor];
      }
      t.fx = t.x = w.x - dx; t.fy = t.y = w.y - dy;
      for(const q of N)
        if(q.anchor != null || q.wall || (q.cent && q.fx == null)) placeAnchored(q);
    }
    if(!raf) draw();
    return;
  }
  const p = pick(mx,my);
  const changed = JSON.stringify(p) !== JSON.stringify(hover);
  hover = p;
  if(p){
    tip.style.display='block';
    tip.style.left=(mx+13)+'px'; tip.style.top=(my+13)+'px';
    if(p.kind==='node'){
      const n=N[p.i];
      tip.textContent = n.type==='site' ? siteLabel(G.sites[n.ref])
        : n.type==='ne' ? neTip(n)
        : n.type==='ticket' ? 'ticket '+TK[n.ref].id+' @ '+G.sites[TK[n.ref].s].n+
            (n.als ? ' '+DEG+' '+n.als.length+(TK[n.ref].na != null
                       ? ' of '+Math.max(TK[n.ref].na, n.als.length)+' alarms here'
                       : ' alarm'+(n.als.length === 1 ? '' : 's')+' here')
                   : ' '+DEG+' '+iso(TK[n.ref].t).slice(11)+' '+DEG+' '+sgn(n.d)+' from its nearest alarm')
        : n.type==='rc' ? 'resolution '+n.ref+' '+DEG+' '+n.cent.length+' ticket'+(n.cent.length === 1 ? '' : 's')
        : n.type==='wo' ? 'work order '+TK[n.tk].wo[n.w].id+' '+DEG+' '+(TK[n.tk].wo[n.w].st || '')+
            ' '+DEG+' ticket '+TK[n.tk].id+(TK[n.tk].wo[n.w].rc ? ' '+DEG+' '+TK[n.tk].wo[n.w].rc : '')
        : n.type==='syn' ? 'synthetic alarm '+n.ref+' '+DEG+' '+(n.tk != null
            ? 'of ticket '+TK[n.tk].id+' '+DEG+' '+synWhere(n).replace(/<[^>]+>/g, '')
            : n.cent.length+' ticket'+(n.cent.length === 1 ? '' : 's'))
        : G.strings[G.alarms[n.ref].n]+' @ '+G.sites[G.alarms[n.ref].s].n
          + (G.alarms[n.ref].dr ? ' ('+G.strings[G.alarms[n.ref].dr]+')' : '');
    } else {
      const e=E[p.i];
      tip.textContent = e.kind==='corr'
        ? (e.ref.s == null ? 'not a model pair' : 'score '+e.ref.s.toFixed(2))+
          ' '+DEG+' '+e.ref.g+'s'
        : e.kind==='bundle' ? bundleTip(e)
        : e.kind==='topo' ? 'real topology link'
        : e.kind==='tklink' ? (N[e.a].type === 'syn' ? 'the synthetic alarm of this ticket'
                               : TK_BY_ID ? 'this alarm is on this ticket'
                                          : 'ticket at this site (matched by site + time)')
        : e.kind==='synjudge' || e.kind==='synsyn'
          ? (e.kind==='synsyn' ? 'two synthetic alarms: ' : 'alarm and its synthetic alarm: ')+(synJudgeInfo(e)
              ? 'cleared '+(synJudgeInfo(e).ok ? 'together' : 'apart')+' ('+dur(synJudgeInfo(e).dc)+', judged by '+
                durT(synJudgeInfo(e).tol)+')' : 'not judged')
        : e.kind==='synlink' ? (SYN_LOW ? 'this alarm is on the ticket of this synthetic alarm'
                                        : 'the synthetic alarm this ticket names')
        : e.kind==='held' ? 'held by its ticket: not a model pair'
        : e.kind==='rcup' ? 'ticket '+TK[N[e.a].ref].id+': '+N[e.b].ref
        : e.kind==='wolink' ? 'ticket '+TK[N[e.b].tk].id+' opened work order '+TK[N[e.b].tk].wo[N[e.b].w].id
        : e.kind==='nelink' ? 'device link on the NE graph: '+neName(e.a)+' '+ARR+' '+neName(e.b)
        : e.kind==='nex2' ? 'X2 / Xn neighbours: '+neName(e.a)+' '+ARR+' '+neName(e.b)
        : e.kind==='necell' ? 'cell '+neName(e.b)+' of '+neName(e.a)
        : e.kind==='nepost' ? neName(e.b)+' at '+G.sites[N[e.a].ref].n
        : e.home ? 'its own site, '+G.sites[N[e.a].ref].n+' (the device it is raised on stands at another site)'
        : e.kind==='anc' || e.dev ? 'alarm raised on '+neName(e.a)
        : e.branch ? 'later alarm at the same site' : 'alarm to its site';
    }
  } else tip.style.display='none';
  if(changed && !raf) draw();
});
cv.addEventListener('mouseleave', ()=>{ tip.style.display='none'; hover=null; if(!raf) draw(); });
cv.addEventListener('wheel', e => {
  if(curIdx<0) return;
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;

  const w0 = worldOf(mx, my, 0);
  cam.k = Math.max(.15, Math.min(20, cam.k*(e.deltaY<0?1.15:1/1.15)));
  const w1 = worldOf(mx, my, 0);
  cam.x += w0.x-w1.x; cam.y += w0.y-w1.y;
  if(!raf) draw();
}, {passive:false});

addEventListener('resize', resize);

if(M.coclear_default && M.coclear_tol_sec != null) $('cc').checked = true;

const PANELS = {
  list:   {grip: 'listGrip',   cssVar: '--list-w',   shut: 'lshut',
           min: 200, max: 760, grows: +1, canvas: true},
  detail: {grip: 'detailGrip', cssVar: '--detail-w', shut: 'dshut',
           min: 240, max: 760, grows: -1, canvas: false},
};
for(const [name, p] of Object.entries(PANELS)){
  const w = +prefGet(name+'W');
  if(w >= p.min && w <= p.max)
    document.documentElement.style.setProperty(p.cssVar, w+'px');
  if(prefGet(name+'Shut') === '1') document.body.classList.add(p.shut);
  const grip = $(p.grip);
  grip.addEventListener('mousedown', e => {
    e.preventDefault(); e.stopPropagation();
    const x0 = e.clientX;
    const w0 = parseFloat(getComputedStyle(document.documentElement)
                          .getPropertyValue(p.cssVar)) || p.min;
    const wasShut = document.body.classList.contains(p.shut);
    let moved = false, pending = false;
    grip.classList.add('on');
    document.body.classList.add('resizing');
    const move = ev => {
      if(!moved && Math.abs(ev.clientX - x0) < 4) return;
      if(!moved){
        moved = true;

        if(wasShut) document.body.classList.remove(p.shut);
      }
      const base = wasShut ? 0 : w0;
      const w = Math.round(Math.max(p.min, Math.min(p.max,
                  base + (ev.clientX - x0) * p.grows)));
      document.documentElement.style.setProperty(p.cssVar, w+'px');
      if(p.canvas && !pending){
        pending = true;
        requestAnimationFrame(() => { pending = false; resize(); });
      }
    };
    const up = () => {
      removeEventListener('mousemove', move);
      removeEventListener('mouseup', up);
      grip.classList.remove('on');
      document.body.classList.remove('resizing');
      if(moved){
        prefSet(name+'W', parseFloat(getComputedStyle(document.documentElement)
                                     .getPropertyValue(p.cssVar)));
        prefSet(name+'Shut', '0');
        if(p.canvas) resize();
      } else {
        togglePanel(name);
      }
    };
    addEventListener('mousemove', move);
    addEventListener('mouseup', up);
  });
}

function togglePanel(name){
  const p = PANELS[name];
  const shut = document.body.classList.toggle(p.shut);
  prefSet(name+'Shut', shut ? '1' : '0');
  if(p.canvas) resize();
}
addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if(tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key === '[')      { togglePanel('list');   e.preventDefault(); }
  else if(e.key === ']') { togglePanel('detail'); e.preventDefault(); }
  else if((e.key === 'm' || e.key === 'M') && curIdx >= 0 && !$('player').hidden){
    setMap(!mapOn); e.preventDefault();
  }
});

buildClusters();
renderList();
