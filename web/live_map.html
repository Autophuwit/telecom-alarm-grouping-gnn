<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Incident Map</title>
<link rel="icon" href="data:,">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --ground: #e4eaec; --panel: #fbfcfc; --raise: #eff3f4; --hair: #d4dde1; --ink: #14212b; --ink2: #55666f; --ink3: #8a99a2;
  --focus: #0e7c86; --focus-soft: #d6eef0;
  --new: #d93a3a; --active: #d98200; --settled: #8796a0;
  --warn-bg: #fff2d4; --warn: #744e00; --err-bg: #fde6e6; --err: #b02020;
  --sev-crit: #d93a3a; --sev-major: #d98200; --sev-minor: #cfae00; --sev-warn: #3b8fd6; --sev-other: #b7c2c8;
  --glass: rgba(251,252,252,.93); --scene-bg: #e4eaec;
  --f-disp: "Chakra Petch", "IBM Plex Sans", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0b1620; --panel: #0f1d28; --raise: #152634; --hair: #213545; --ink: #e3ebef; --ink2: #93a6b1; --ink3: #627784;
    --focus: #3cc4c6; --focus-soft: #0f3438;
    --new: #ff5f5f; --active: #f2a227; --settled: #6c808d;
    --warn-bg: #33270a; --warn: #f3c45e; --err-bg: #3a1217; --err: #ff9d9a;
    --glass: rgba(15,29,40,.92); --scene-bg: #0d1117;
  }
  :root:not([data-theme="light"]) .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }
}

:root[data-theme="dark"] {
  --ground: #0b1620; --panel: #0f1d28; --raise: #152634; --hair: #213545; --ink: #e3ebef; --ink2: #93a6b1; --ink3: #627784;
  --focus: #3cc4c6; --focus-soft: #0f3438;
  --new: #ff5f5f; --active: #f2a227; --settled: #6c808d;
  --warn-bg: #33270a; --warn: #f3c45e; --err-bg: #3a1217; --err: #ff9d9a;
  --glass: rgba(15,29,40,.92); --scene-bg: #0d1117;
}
:root[data-theme="dark"] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }
.themeb { flex: none; display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 13px;
          border: 1px solid var(--hair); background: var(--raise); color: var(--ink2); font-size: 12px; cursor: pointer; }
.themeb:hover { color: var(--ink); border-color: var(--ink3); }
.themeb svg { width: 13px; height: 13px; }

.conf { display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; font: 600 11.5px var(--f-disp);
        font-variant-numeric: tabular-nums; color: var(--ink2); white-space: nowrap; }
.conf i { display: inline-block; width: 26px; height: 5px; border-radius: 3px; background: var(--hair); position: relative; overflow: hidden; }
.conf i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--focus); }
.c-top .conf { margin-left: auto; margin-right: 2px; }
#tip.pinned { border-color: var(--focus); box-shadow: 0 4px 14px rgba(0,0,0,.18); }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ground); color: var(--ink); display: flex; font: 14px/1.5 var(--f-body); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

#mapwrap { flex: 1; min-width: 0; position: relative; }
#map { position: absolute; inset: 0; background: var(--ground); }
.leaflet-container { font-family: var(--f-body); }
.leaflet-bar a { background: var(--panel); color: var(--ink); border-color: var(--hair); }
.leaflet-tooltip { font-family: var(--f-body); border-radius: 6px; }

aside { width: 420px; max-width: 100%; display: flex; flex-direction: column; background: var(--panel);
        border-left: 1px solid var(--hair); min-height: 0; }
.status { display: flex; align-items: center; gap: 10px; padding: 12px 18px 10px; }
.brand { font: 600 15px/1.2 var(--f-disp); letter-spacing: .01em; }
.lamp { width: 10px; height: 10px; border-radius: 50%; background: #1fb26b; flex: none; box-shadow: 0 0 0 0 rgba(31,178,107,.55);
        animation: lamp 2.4s infinite; }
.lamp.stale { background: var(--active); animation: none; }
@keyframes lamp { 70% { box-shadow: 0 0 0 7px rgba(31,178,107,0); } 100% { box-shadow: 0 0 0 0 rgba(31,178,107,0); } }
.fresh { margin-left: auto; text-align: right; font-size: 12px; line-height: 1.35; color: var(--ink2); }
.fresh b { color: var(--ink); font: 600 13px var(--f-disp); font-variant-numeric: tabular-nums; }
.banner { display: none; margin: 0 14px 8px; padding: 8px 11px; border-radius: 6px; font-size: 12.5px; line-height: 1.45; }
.banner.show { display: block; }
#stale, #old { background: var(--warn-bg); color: var(--warn); }
#err { background: var(--err-bg); color: var(--err); }

.states { display: grid; grid-template-columns: repeat(3, 1fr); margin: 2px 14px 12px; border: 1px solid var(--hair); border-radius: 8px; overflow: hidden; }
.st-sw { position: relative; display: grid; gap: 1px; text-align: left; padding: 9px 12px 8px; background: var(--panel); border: 0; cursor: pointer; }
.st-sw + .st-sw { border-left: 1px solid var(--hair); }
.st-sw::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--c); }
.st-sw b { font: 600 23px/1.1 var(--f-disp); font-variant-numeric: tabular-nums; }
.st-sw span { font-size: 12.5px; color: var(--ink2); }
.st-sw[aria-pressed="false"] { background: var(--raise); }
.st-sw[aria-pressed="false"]::before { background: transparent; }
.st-sw[aria-pressed="false"] b { color: var(--ink3); }
.st-sw:hover { background: var(--raise); }

.filters { padding: 0 14px 10px; display: grid; gap: 8px; border-bottom: 1px solid var(--hair); }
.search { position: relative; }
.search input { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid var(--hair); border-radius: 7px; background: var(--raise);
                color: var(--ink); font: inherit; outline: none; }
.search input:focus { border-color: var(--focus); background: var(--panel); box-shadow: 0 0 0 3px var(--focus-soft); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink3); }
.frow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--ink2); }
.frow select { font: inherit; padding: 2px 3px; border: 1px solid var(--hair); border-radius: 5px; background: var(--panel); color: var(--ink); }
.tog { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border: 1px solid var(--hair); border-radius: 999px;
       cursor: pointer; background: var(--panel); }
.tog[aria-pressed="true"] { border-color: var(--focus); background: var(--focus-soft); color: var(--ink); }
#summary { padding: 7px 18px; font-size: 12px; color: var(--ink2); border-bottom: 1px solid var(--hair); }

#list, #detail { flex: 1; overflow-y: auto; min-height: 0; }
.card { display: grid; grid-template-columns: 76px 1fr; cursor: pointer; border-bottom: 1px solid var(--hair); }
.card:hover { background: var(--raise); }
.card:focus-visible { outline-offset: -2px; }
.c-time { padding: 11px 0 0 18px; display: grid; align-content: start; gap: 1px; }
.c-time b { font: 600 15px/1.2 var(--f-disp); font-variant-numeric: tabular-nums; }
.c-time span { font-size: 11px; color: var(--ink3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.c-body { min-width: 0; padding: 10px 18px 11px 12px; margin-left: 4px; border-left: 3px solid var(--c); display: grid; gap: 3px; }
.c-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.c-title { font: 600 14.5px/1.3 var(--f-disp); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-title .plus { font: 500 12px var(--f-body); color: var(--ink2); }
.c-title.none { font: 500 13.5px var(--f-body); color: var(--ink2); }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink2); white-space: nowrap; }
.st i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.c-stats { font-size: 12.5px; color: var(--ink2); }
.c-stats b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.c-alarm { font-size: 12px; color: var(--ink3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sevbar { display: flex; height: 3px; margin-top: 3px; border-radius: 2px; overflow: hidden; background: var(--raise); }
.sevbar span { display: block; height: 100%; }
.more { padding: 16px 18px; font-size: 12.5px; color: var(--ink2); }

#detail { display: none; padding: 12px 18px 22px; }
.back { font-size: 13px; color: var(--focus); background: none; border: 0; padding: 0; cursor: pointer; }
.d-state { display: flex; align-items: center; gap: 7px; margin-top: 14px; font-size: 12.5px; color: var(--ink2); }
.d-state i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.d-state b { color: var(--ink); font-weight: 600; }
#detail h2 { font: 600 23px/1.2 var(--f-disp); margin: 4px 0 2px; word-break: break-all; }
#detail h2 .plus { font: 500 13px var(--f-body); color: var(--ink2); }
.d-id { font: 500 12px var(--f-disp); color: var(--ink3); word-break: break-all; letter-spacing: .02em; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); margin: 14px 0 6px; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.stats div { padding: 8px 0 7px 10px; }
.stats div:first-child { padding-left: 0; }
.stats div + div { border-left: 1px solid var(--hair); }
.stats b { display: block; font: 600 21px/1.15 var(--f-disp); font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--ink2); }
.in3 { font-size: 12.5px; color: var(--ink2); margin: 10px 0 0; line-height: 1.55; }
.in3 b { color: var(--ink); font-weight: 600; }
#detail h3 { font-size: 13px; font-weight: 600; margin: 20px 0 6px; color: var(--ink); }
#detail h3 span { font-weight: 400; color: var(--ink3); }
.kv { display: grid; grid-template-columns: 104px 1fr; gap: 4px 10px; font-size: 13px; margin-top: 12px; }
.kv div:nth-child(odd) { color: var(--ink2); }
.chip { display: inline-block; font: 500 12px var(--f-disp); padding: 2px 8px; margin: 0 4px 5px 0; border-radius: 4px;
        background: var(--raise); border: 1px solid var(--hair); letter-spacing: .02em; }
.sevrow { display: grid; grid-template-columns: 88px 1fr 40px; gap: 8px; align-items: center; font-size: 12.5px; margin: 4px 0; }
.sevrow .bar { height: 6px; border-radius: 3px; }
.sevrow .n { text-align: right; font-variant-numeric: tabular-nums; }
ul.plain { list-style: none; padding: 0; margin: 0; font-size: 12.5px; }
ul.plain li { padding: 5px 0; border-bottom: 1px solid var(--hair); display: flex; justify-content: space-between; gap: 8px; }
ul.plain li span:last-child { font-variant-numeric: tabular-nums; color: var(--ink2); }
a.lnk { color: var(--focus); cursor: pointer; text-decoration: underline; }
.note { font-size: 12.5px; color: var(--ink2); margin-top: 8px; line-height: 1.5; }
.note.warn { background: var(--warn-bg); color: var(--warn); padding: 8px 11px; border-radius: 6px; }
.foot { padding: 8px 18px; border-top: 1px solid var(--hair); font-size: 11.5px; color: var(--ink3); display: flex; gap: 14px; flex-wrap: wrap; }
.foot b { color: var(--ink2); font-weight: 500; }

.legend { background: var(--glass); color: var(--ink); padding: 9px 12px; border-radius: 7px; font-size: 12px; line-height: 1.8;
          border: 1px solid var(--hair); backdrop-filter: blur(6px); }
.legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: -1px; }
.legend .sub { color: var(--ink2); }
#scene { position: absolute; inset: 0; display: none; background: var(--scene-bg); z-index: 1200; overflow: hidden; }
#scene.show { display: block; }
#scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#scene canvas.drag { cursor: grabbing; }
.sctl { position: absolute; top: 12px; left: 12px; right: 250px; bottom: 12px; display: flex; flex-direction: column; gap: 8px;
        align-items: flex-start; z-index: 2; pointer-events: none; }
.sctl > * { pointer-events: auto; }
.sbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.player { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border: 1px solid var(--hair); border-radius: 7px;
          background: var(--glass); backdrop-filter: blur(6px); font-size: 12.5px; max-width: 100%; flex-wrap: wrap; }
.player button { border: 1px solid var(--hair); background: var(--panel); border-radius: 5px; padding: 4px 7px; line-height: 0; cursor: pointer; }
.player button.txt { line-height: 1.2; font-size: 12px; padding: 3px 9px; }
.player button svg { width: 12px; height: 12px; fill: currentColor; }
.player button:hover { background: var(--raise); }
.player input[type=range] { width: 200px; accent-color: var(--focus); }
.player select { font: inherit; font-size: 12px; padding: 2px 3px; border: 1px solid var(--hair); border-radius: 5px; background: var(--panel); color: var(--ink); }
#pl-time { color: var(--ink2); white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 150px; }
#pl-time b { color: var(--ink); font-weight: 600; }
.nowcard { width: 340px; max-width: 100%; min-height: 0; overflow-y: auto; padding: 8px 11px 9px; border: 1px solid var(--hair);
           border-radius: 7px; background: var(--glass); backdrop-filter: blur(6px); font-size: 12px; line-height: 1.45; }
.nowcard[hidden] { display: none; }
.nc-h { display: flex; flex-wrap: wrap; gap: 3px 9px; align-items: baseline; cursor: pointer; user-select: none; color: var(--ink2); }
.nc-h b { font: 600 14px var(--f-disp); color: var(--ink); font-variant-numeric: tabular-nums; }
.nc-fold { margin-left: auto; color: var(--ink3); }
.nowcard.fold .nc-g, .nowcard.fold .nc-more { display: none; }
.nc-g { margin-top: 7px; }
.nc-chip { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 4px; color: #fff; }
.nc-r { display: flex; gap: 9px; align-items: baseline; padding: 2px 0 0 6px; }
.nc-s { font-weight: 600; flex: none; min-width: 62px; }
.nc-n { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink2); }
.nc-v { color: var(--ink3); font-size: 11px; flex: none; }
.nc-new { color: var(--focus); font-size: 10.5px; font-weight: 600; flex: none; }
.nc-more { margin-top: 6px; color: var(--ink3); }
.typebar span { opacity: .9; }
.typesyms { display: flex; flex-wrap: wrap; gap: 3px 10px; margin-top: 5px; font-size: 11.5px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.typesyms span { display: inline-flex; align-items: center; gap: 3px; }
.typesyms .more_ { color: var(--ink3); }
.splitting { color: var(--active); font-weight: 600; }
.fsym { vertical-align: -1px; flex: none; }
.nc-chip .fsym { vertical-align: -1px; }
.sgrp { display: flex; border: 1px solid var(--hair); border-radius: 7px; overflow: hidden; background: var(--glass); backdrop-filter: blur(6px); }
.sgrp .sbtn { border: 0; border-radius: 0; background: none; }
.sgrp .sbtn + .sbtn { border-left: 1px solid var(--hair); }
.sgrp .sbtn[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.sbtn { font-size: 13px; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--hair); background: var(--glass); cursor: pointer; }
.sbtn:hover { background: var(--raise); }
.sbtn.primary { background: var(--ink); border-color: var(--ink); color: var(--panel); font-weight: 600; }
.sbtn.primary:hover { opacity: .88; }
.sbtn.ic { font-size: 15px; padding: 4px 11px; }
.shint { position: absolute; top: 12px; right: 12px; z-index: 2; font-size: 12px; line-height: 1.5; padding: 7px 11px; border-radius: 7px;
         background: var(--glass); color: var(--ink2); border: 1px solid var(--hair); text-align: right; }
.shint b { color: var(--ink); font-weight: 600; }
.sleg { position: absolute; left: 12px; bottom: 14px; z-index: 2; display: grid; gap: 1px; max-height: calc(100% - 90px); overflow-y: auto; }
.sleg .lg-h { font-weight: 600; margin: 4px 0 1px; }
.sleg .lg-h:first-child { margin-top: 0; }
.sleg .row { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.sleg label { cursor: pointer; }
.sleg input { accent-color: var(--focus); margin: 0 2px 0 0; }
.sleg .sym { display: inline-block; width: 14px; text-align: center; }
.sleg .off { padding-left: 19px; }
.sattr { position: absolute; right: 6px; bottom: 4px; z-index: 2; font-size: 10.5px; color: var(--ink2); background: var(--glass);
         padding: 1px 6px; border-radius: 4px; }
#tip { position: absolute; z-index: 3; pointer-events: none; display: none; background: var(--glass); color: var(--ink);
       border: 1px solid var(--hair); border-radius: 7px; padding: 7px 10px; font-size: 12.5px; backdrop-filter: blur(6px);
       max-width: 340px; white-space: pre-line; line-height: 1.45; }
#tip::first-line { font-weight: 600; }

@media (max-width: 800px) {
  body { flex-direction: column; }
  #mapwrap { flex: none; height: 52vh; }
  aside { width: 100%; border-left: 0; border-top: 1px solid var(--hair); flex: 1; }
  .shint { display: none; }
  .sctl { right: 12px; }
  .player input[type=range] { width: 110px; }
  .nowcard { display: none; }
  .sleg { font-size: 11px; line-height: 1.6; padding: 6px 9px; }
}
@media (prefers-reduced-motion: reduce) { .lamp { animation: none; } }

.replay { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--hair);
  background: var(--raise); font: 600 12px var(--f-body); color: var(--ink2); }
.replay[hidden] { display: none; }
.replay button { border: 1px solid var(--hair); background: var(--panel); color: var(--ink); border-radius: 6px;
  min-width: 30px; height: 26px; cursor: pointer; font: 600 12px var(--f-body); }
.replay button:hover { border-color: var(--focus); }
.replay input[type=range] { flex: 1; min-width: 60px; accent-color: var(--focus); }
.replay #rp-time { font: 700 14px var(--f-disp); color: var(--ink); min-width: 42px; text-align: right; }
.replay .rp-tag { font: 700 10px var(--f-disp); letter-spacing: .06em; color: var(--focus); text-transform: uppercase; }
</style>
</head>
<body>
<div id="mapwrap">
  <div id="map"></div>
  <div id="scene">
    <canvas id="cv" aria-label="3-D view of the selected incident"></canvas>
    <div class="sctl">
    <div class="sbar">
      <button class="sbtn primary" id="s-back">‹ Back to overview</button>
      <div class="sgrp" role="group" aria-label="Detail">
        <button class="sbtn" id="s-sites" aria-pressed="false" title="Sites, alarms and tickets only">Sites only</button>
        <button class="sbtn" id="s-full" aria-pressed="true" title="With the device stack: transport, RAN, cells">Full detail</button>
      </div>
      <div class="sgrp">
        <button class="sbtn ic" id="s-left" title="Turn left 30°" aria-label="Turn left">⟲</button>
        <button class="sbtn ic" id="s-right" title="Turn right 30°" aria-label="Turn right">⟳</button>
        <button class="sbtn" id="s-tilt">Top view</button>
        <button class="sbtn" id="s-reset">Reset view</button>
      </div>
    </div>
    <div class="player" id="player">
      <button id="pl-reset" title="Back to the first alarm (Home)" aria-label="First alarm"><svg viewBox="0 0 12 12"><path d="M1.5 2h1.6v8H1.5zM7 2v8L3.6 6zM11 2v8L7.6 6z"/></svg></button>
      <button id="pl-prev" title="Previous moment (←)" aria-label="Previous moment"><svg viewBox="0 0 12 12"><path d="M2 2h1.6v8H2zM10 2v8L4 6z"/></svg></button>
      <button id="pl-play" title="Play / pause (Space)" aria-label="Play or pause"></button>
      <button id="pl-next" title="Next moment (→)" aria-label="Next moment"><svg viewBox="0 0 12 12"><path d="M8.4 2H10v8H8.4zM2 2v8l6-4z"/></svg></button>
      <input type="range" id="pl-bar" min="-1" max="1" step="1" value="1" title="Drag to any moment" aria-label="Replay time">
      <span id="pl-time"></span>
      <select id="pl-speed" title="Replay speed" aria-label="Replay speed">
        <option value="m">By moment</option><option value="5">×5 real time</option><option value="15">×15 real time</option><option value="60">×60 real time</option>
      </select>
      <button class="txt" id="pl-all" title="Show every alarm (End)">Show all</button>
    </div>
    <div class="nowcard" id="now" hidden></div>
    </div>
    <div class="shint"><b>Right-drag</b> to turn and tilt<br>Drag to pan, wheel to zoom</div>
    <div class="legend sleg l3" id="sleg"></div>
    <div class="sattr">© OpenStreetMap</div>
    <div id="tip"></div>
  </div>
</div>
<aside>
  <div class="status">
    <span class="lamp" id="h-live"></span>
    <span class="brand">Live incident map</span>

    }
    return out;
  }

  function confTip() {
    var rs = (data && data.rounds) || [];
    return "Confidence: the round model's mean score over the cluster pairs this group was joined on (each weighted by "
      + "their alarms), as the average joins them. It is the model's own score, not a measured accuracy. "
      + (rs.length ? "For scale, on the training day the joins at each round's threshold were right at least: "
         + rs.map(function (r) { return "R" + r.k + " (at " + r.thr + ") " + (r.floor != null ? Math.round(r.floor * 100) + "%" : "?"); }).join(", ") + ". " : "")
      + "An incident on one site grouped by the episode rule alone (no gap over 5 min) has no score. The episode rule "
      + "never joins two sites: an incident of several sites with no score is the map holding together alarms the model "
      + "now has apart.";
  }

  function noConf(x) {
    var g = x.groups_now, lv = x.leaving || [];

    if (lv.length) return (x.stay_sites || 0) <= 1
      ? { pill: "rule", row: "none: what stays is one site, grouped by the episode rule (the rest is leaving, see Splitting)" }
      : { pill: "held", row: "none: what stays has no model join this update (the rest is leaving, see Splitting)" };
    if (g != null && g > 1) return { pill: "held", row: "none: the model now has these alarms in " + g + " separate groups; the map keeps them under one ID for up to 3 updates before it splits them" };
    if ((x.stay_sites != null ? x.stay_sites : x.n_sites || 0) > 1 || (x.n_sites || 0) > 1)
      return { pill: "held", row: "none: the model's group now is one site; the other sites are alarms older than the 6-h live window (not in the 3-D view) that keep this ID" };
    return { pill: "rule", row: "none: one site, grouped by the episode rule" };
  }

  function leaveTxt(p) {
    if (!p) return "the model now groups it elsewhere";
    return (p[0] ? "the model now groups it with " + p[0] : "the model now has it on its own")
      + "; the map moves it once that holds " + ((data && data.hold) || 3) + " updates";
  }
  function leavingRow(x) {
    var lv = x.leaving || [];
    if (!lv.length) return "";
    var na = lv.reduce(function (s, p) { return s + p.n_alarms; }, 0), ns = lv.reduce(function (s, p) { return s + p.n_sites; }, 0);
    var tip = "The model already groups these alarms apart from this incident. The map keeps them here until that has held "
      + (lv[0].of || 3) + " updates in a row (so a one-update wobble does not make the map flicker); then they move. "
      + "In the 3-D view they are drawn dashed.";
    return '<div title="' + esc(tip) + '">Splitting ⓘ</div><div title="' + esc(tip) + '">'
      + plural(na, "alarm") + " on " + plural(ns, "site") + " leaving (dashed in 3-D): "
      + lv.map(function (p) { return (p.to ? "→ " + esc(p.to) : "→ on their own") + " (" + p.n_alarms + ", update " + p.held + " of " + p.of + ")"; }).join("; ")
      + "</div>";
  }
  function confPill(x) {
    if (!data || data.engine !== "mb") return "";
    if (x.conf == null) return '<span class="conf" title="' + esc(noConf(x).row) + '">' + noConf(x).pill + "</span>";
    var p = Math.round(x.conf * 100);
    return '<span class="conf" title="' + esc(confTip()) + '"><i style="--w:' + p + '%"></i>' + p + "%</span>";
  }
  function confRow(x) {
    if (!data || data.engine !== "mb") return "";
    return '<div title="' + esc(confTip()) + '">Confidence ⓘ</div><div title="' + esc(confTip()) + '">'
      + (x.conf == null ? noConf(x).row : Math.round(x.conf * 100) + "% (the model's mean join score"
         + ((x.leaving || []).length ? ", the staying part" : "") + ")") + "</div>";
  }

  function typesHtml(x) {
    var e = typeEntries(x), light = !isDark();
    if (!e) {
      var sev = sevEntries(x.severity), sm = Math.max.apply(null, sev.map(function (p) { return p[1]; }).concat([1]));
      return "<h3>Severity</h3>" + sev.map(function (p) {
        return '<div class="sevrow"><span>' + esc(p[0] || "(blank)") + '</span><span class="bar" style="width:' + Math.max(2, 100 * p[1] / sm).toFixed(0) + "%;background:" + sevColour(p[0]) + '"></span><span class="n">' + p[1] + "</span></div>";
      }).join("");
    }
    var mx = Math.max.apply(null, e.map(function (p) { return p[1]; }).concat([1]));
    return "<h3>Alarms by type <span>" + e.length + "</span></h3>" + e.map(function (p) {
      return '<div class="sevrow" style="grid-template-columns:128px 1fr 40px"><span>' + famSvg(p[0], alarmRed(light), 11) + " " + esc(p[0]) + '</span><span class="bar" style="width:' + Math.max(2, 100 * p[1] / mx).toFixed(0)
        + "%;background:" + alarmRed(light) + '"></span><span class="n">' + p[1] + "</span></div>";
    }).join("");
  }
  function showDetail(id) {
    var x = byId[id], d = $("detail"), l = $("list");
    if (!x) { d.innerHTML = '<button class="back">‹ Back to list</button><div class="note">' + esc(id) + " is not in the latest round.</div>"; }
    else {
      var tk = x.tickets || [], in3 = scene.on && scene.id === x.id, g_ = groupOf(x.id), note3 = in3 ? view3dNote(x, true) : "";
      var has3 = g_ != null && !no3d[(views.generated_at || "") + "|" + g_];
      d.innerHTML = '<button class="back">‹ Back to list</button>'
        + (fromId ? '<div class="note warn" id="merged-note">' + esc(fromId) + " was merged into this incident.</div>" : "")
        + '<div class="d-state" style="--c:' + STATE[x.state] + '" title="' + esc(TIP[x.state]) + '"><i></i><b>' + LBL[x.state] + "</b>"
        + (x.why_frozen ? "<span>(" + esc(WHY[x.why_frozen] || x.why_frozen) + ")</span>" : "") + "</div>"
        + "<h2>" + esc(tk[0] || "No ticket yet") + (tk.length > 1 ? ' <span class="plus">and ' + plural(tk.length - 1, "more ticket") + "</span>" : "") + "</h2>"
        + '<div class="d-id" id="d-id">' + esc(x.id) + "</div>"
        + '<div class="stats"><div><b>' + fmt(x.n_alarms) + "</b><span>alarms</span></div><div><b>" + fmt(x.n_sites) + "</b><span>sites</span></div>"
        + "<div><b>" + tk.length + "</b><span>tickets</span></div><div><b>" + Math.max(1, Math.round((x.last_t - x.first_t) / 60)) + "</b><span>minutes</span></div></div>"
        + (has3
           ? (in3 ? (note3 ? '<div class="note warn">' + note3 + "</div>" : "") : '<div class="in3">Loading the 3-D view…</div>')
           : '<div class="note warn">No 3-D view of this incident in this round. The 3-D views cover incidents that are still open or settled within the last 2 h. The map shows its sites only.</div>')
        + '<div class="kv">'
        + confRow(x) + leavingRow(x)
        + "<div>Started</div><div>" + ddmm(x.first_onset) + " " + hhmm(x.first_onset) + "</div>"
        + "<div>Last alarm</div><div>" + ddmm(x.last_onset) + " " + hhmm(x.last_onset) + " (" + dur(x.first_t, x.last_t) + " in all)</div>"
        + (x.n_in_window != null && x.n_in_window !== x.n_alarms ? "<div>In the window</div><div>" + fmt(x.n_in_window) + " of " + plural(x.n_alarms, "alarm") + "</div>" : "")
        + "<div>Centre</div><div>" + (x.lat == null ? "none" : x.lat.toFixed(4) + ", " + x.lon.toFixed(4)) + "</div>"
        + blastRows(x, in3)
        + (x.split_from ? '<div title="' + SPLIT_TIP + '">Split from ⓘ</div><div title="' + SPLIT_TIP + '"><a class="lnk" data-go="' + esc(x.split_from) + '">' + esc(x.split_from) + "</a></div>" : "")
        + "</div>"
        + "<h3>Tickets <span>" + tk.length + "</span></h3>"
        + (tk.length ? tk.map(function (t) { return '<span class="chip">' + esc(t) + "</span>"; }).join("") : '<div class="note">No ticket yet.</div>')
        + typesHtml(x)
        + '<h3>Most common alarms</h3><ul class="plain">'
        + (x.top_alarms || []).map(function (a) { return "<li><span>" + esc(a[0]) + "</span><span>" + a[1] + "</span></li>"; }).join("") + "</ul>"
        + "<h3>Sites <span>" + (x.n_sites || 0) + "</span></h3>"
        + (x.sites || []).map(function (s) { return '<span class="chip">' + esc(s) + "</span>"; }).join("")
        + ((x.n_sites || 0) > (x.sites || []).length ? '<div class="note">The first ' + (x.sites || []).length + " sites.</div>" : "")
        + ((x.merged_from || []).length ? "<h3>Merged from <span>" + x.merged_from.length + '</span></h3><ul class="plain">'
           + x.merged_from.map(function (m) { return "<li><span>" + esc(m) + "</span></li>"; }).join("") + "</ul>" : "")
        + '<div class="note" style="margin-top:18px">Model output, not reviewed by a person.</div>';
    }
    d.style.display = "block"; l.style.display = "none";
    d.querySelector(".back").onclick = back;
    d.querySelectorAll("[data-go]").forEach(function (a) { a.onclick = function () { select(a.dataset.go); }; });
  }

  function freshness() {
    if (!data) return;
    if (REPLAY) { $("old").classList.remove("show"); return; }

    var age = ageMin(data.generated_at), el = $("old"), lim = Math.max(OLD_MIN, 4 * (data.tick_min || 5) + 5);
    var old = age != null && age > lim;
    el.textContent = old ? "The map has not updated since " + String(data.generated_at).slice(11, 16) + " (" + Math.round(age)
      + " min ago)." : "";
    el.classList.toggle("show", old);
    $("h-live").classList.toggle("stale", old || !!data.stale);
  }
  function load() {
    fetch(SRC.views + "?_=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { if (j) views = j; }).catch(function () {});
    fetch(SRC.latest + "?_=" + Date.now(), { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (j) {
      data = j; byId = {}; mergedTo = {};
      j.incidents.forEach(function (x) {
        byId[x.id] = x;
        (x.merged_from || []).forEach(function (m) { mergedTo[m] = x.id; });
      });
      $("h-gen").textContent = (j.generated_at || "").slice(11, 19) || "–";
      $("h-lag").textContent = j.data_lag_min == null ? "" : "Alarm data " + j.data_lag_min + " min behind";
      $("h-itsm").textContent = j.itsm || "–";
      $("h-model").textContent = "Model " + String(j.run || "").replace(/^.*[\\/]/, "") + " @ " + j.threshold + ", hold " + j.hold;
      $("h-live").title = j.stale ? "Data is not fresh" : "Data is fresh";
      $("stale").classList.toggle("show", !!j.stale);
      $("err").classList.remove("show");
      freshness();
      var first = !data0; data0 = true;
      if (sel && !byId[sel]) { var r = resolve(sel); if (r !== sel) fromId = sel; sel = r; }
      render();
      if (first && sel) setTimeout(function () { load3d(sel); }, 800);
      else if (sel && groupOf(sel) != null) load3d(sel);
    }).catch(function (e) {
      var el = $("err");
      el.textContent = "Could not load latest.json (" + e.message + "). Retrying in 60 s.";
      el.classList.add("show");
      $("h-live").classList.add("stale");
    });
  }
  resolveColours();
  if (location.hash.length > 1) sel = decodeURIComponent(location.hash.slice(1));
  window.addEventListener("hashchange", function () {
    var h = decodeURIComponent(location.hash.slice(1));
    if (h && h !== sel && data) select(h);
  });
  function replayGo(k) {
    var R = REPLAY;
    R.k = Math.max(0, Math.min(R.ticks.length - 1, k));
    SRC.latest = "ticks/" + R.ticks[R.k] + ".json";
    $("rp-bar").value = R.k;
    $("rp-time").textContent = R.ticks[R.k].slice(0, 2) + ":" + R.ticks[R.k].slice(2);
    load();
  }
  function replayPlay(on) {
    var R = REPLAY;
    R.on = on;
    $("rp-play").innerHTML = on ? "&#10074;&#10074;" : "&#9654;";
    clearInterval(R.timer);
    if (on) R.timer = setInterval(function () {
      if (R.k >= R.ticks.length - 1) { replayPlay(false); return; }
      replayGo(R.k + 1);
    }, R.ms);
  }
  function startReplay(ix) {
    REPLAY = { ticks: ix.ticks, k: 0, on: false, ms: 1600, timer: null };
    $("replay").hidden = false;
    $("rp-day").textContent = ix.day + " · synthetic network";
    var bar = $("rp-bar");
    bar.max = ix.ticks.length - 1;
    bar.oninput = function () { replayPlay(false); replayGo(+bar.value); };
    $("rp-play").onclick = function () { replayPlay(!REPLAY.on); };
    $("rp-prev").onclick = function () { replayPlay(false); replayGo(REPLAY.k - 1); };
    $("rp-next").onclick = function () { replayPlay(false); replayGo(REPLAY.k + 1); };
    replayGo(ix.start != null ? ix.start : 0);
  }
  fetch("ticks/index.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("live"); return r.json(); })
    .then(startReplay)
    .catch(function () { load(); setInterval(load, REFRESH_MS); setInterval(freshness, 30000); });
  function retheme() {
    resolveColours(); themeButton(); render();
    if (scene.on && scene.doc) buildLegend(scene.doc);
    dirty();
  }
  themeButton();
  $("theme").onclick = function () {
    var t = isDark() ? "light" : "dark";
    document.documentElement.dataset.theme = t;
    store("incmap.theme", t);
    retheme();
  };
  if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", retheme);
})();
</script>
</body>
</html>
