[project]
name = "alarm-incident-gnn"
version = "0.1.0"
description = "Group telecom network alarms into incidents with a graph neural network, without ground-truth labels"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "torch>=2.2",
    "torch-geometric>=2.5",
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
